name: knowledge-evaluation
services:
  evaluation:
    image: ${EVAL_IMAGE:-knowledge-evaluation:local}
    build:
      context: ..
    restart: unless-stopped
    env_file: ${EVAL_ENV_FILE:?Set EVAL_ENV_FILE to the protected runtime configuration}
    environment:
      EVAL_DATA_DIR: /var/lib/evaluation
      EVAL_PORT: '8090'
    volumes:
      - evaluation-data:/var/lib/evaluation
    ports:
      - '${EVAL_BIND_ADDRESS:-127.0.0.1}:${EVAL_PORT:-8090}:8090'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/evaluation/api/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
volumes:
  evaluation-data:
