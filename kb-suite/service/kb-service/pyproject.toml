[project]
name = "kb-service"
version = "0.2.0"
description = "Knowledge service: ingestion, retrieval, management API, DA tool API and MCP (partly ported from WeKnora)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "asyncpg>=0.29,<0.31",
  "httpx>=0.27,<1.0",
  "grpcio>=1.62,<2",
  "protobuf>=5.26,<7",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "python-multipart>=0.0.9",
  "mcp>=1.12,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kb_service*"]

[tool.setuptools.package-data]
kb_service = ["migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
