[project]
name = "kb-provider-kit"
version = "0.1.0"
description = "Shared pieces of knowledge-provider/v1 adapters: inbound auth, id prefixes, error shape"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kb_provider_kit*"]
