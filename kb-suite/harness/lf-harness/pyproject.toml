[project]
name = "loopforest-harness"
version = "0.1.0"
description = "openJiuwen harness provider (HarnessProtocol 1.0) for the kb-suite Loop Forest service"
requires-python = ">=3.11"
dependencies = [
  "openjiuwen>=0.1.19",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

# One provider per wheel (Swarm custom agents require exactly one entry point).
[project.entry-points."openjiuwen.harness_providers"]
loopforest = "loopforest_harness.provider:LoopForestHarnessProvider"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The wheel carries a copy of deepanalyze_harness (the shared implementation of the
# DA-compatible protocol); the Swarm image build copies it in from ../da-harness.
[tool.setuptools.packages.find]
include = ["loopforest_harness*", "deepanalyze_harness*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
