# Knowledge backends behind kb-gateway (contracts/knowledge-provider/v1).
#
# Exactly one backend is the default: knowledge bases created without a backend
# go there, and its ids carry no prefix (existing kb-service ids stay valid).
# Every other backend needs a unique id_prefix; its adapter puts it on all ids.
# Credentials are env var names; the values come from keys.env / gateway.env.
# optional: true marks a backend that is deployed only on demand (up-weknora,
# up-da-kb): until it has answered once it is neither listed nor reported unavailable.
backends:
  - id: kbs
    label: kb-service
    base_url: http://kbs-api:8080
    credential_env: KBS_PLUGIN_KEY
    # DA tool calls forwarded to kb-service need reprocess and tenant assertion
    tools_credential_env: KBS_DA_KEY
    default: true
  - id: weknora
    label: WeKnora
    base_url: http://weknora-adapter:8080
    credential_env: KBGW_WEKNORA_ADAPTER_KEY
    id_prefix: wk_
    optional: true
  - id: da
    label: DA 知识管线
    base_url: http://da-kb-adapter:8080
    credential_env: KBGW_DA_ADAPTER_KEY
    id_prefix: da_
    optional: true
