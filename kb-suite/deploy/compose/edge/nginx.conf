# kb-suite 对外入口（5199），反代到 Swarm 的 Web 服务（swarm:5173）。
#
# Swarm 对插件页资源回 `Cache-Control: no-cache` 且不认条件请求，左侧导航每次
# 切到插件页都会重建 iframe、整份重下未压缩的 JS。这里补两件事：
#   - gzip：插件页和 Swarm 主包都按文本压缩（插件 JS 约缩到 1/3）；
#   - 插件页里带内容哈希的资源（assets/<name>-<hash>.<ext>）改成长缓存，
#     入口 html 仍每次回源，所以重新构建后会拿到新的哈希名。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;

    client_max_body_size 0;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # 网关 WS 和插件 WS 都是长连接；分析结果是流式推送，不缓冲
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
    proxy_buffering off;
    proxy_request_buffering off;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    location ~ "^/api/application-plugins/[^/]+/assets/assets/.+-[A-Za-z0-9_-]{8,}\.(js|css|svg|png|woff2?)$" {
        proxy_pass http://swarm:5173;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://swarm:5173;
    }
}
