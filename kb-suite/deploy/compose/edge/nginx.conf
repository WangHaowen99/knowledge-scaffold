# kb-suite 对外入口（5199），反代到 Swarm 的 Web 服务（swarm:5173）。
#
# Swarm 对插件页资源回 `Cache-Control: no-cache` 且不认条件请求，左侧导航每次
# 切到插件页都会重建 iframe、整份重下未压缩的 JS。这里补两件事：
#   - gzip：插件页和 Swarm 主包都按文本压缩（插件 JS 约缩到 1/3）；
#   - 插件页里 Vite 产出的带内容哈希的资源（assets/<name>-<8 位哈希>.<ext>）
#     改成长缓存，只给成功响应加；入口 html 仍每次回源，所以重新构建后会拿到新的哈希名。
#
# swarm 的地址每 10 秒重新解析一次：重建 swarm 容器后 IP 可能变，不用跟着重启 edge。
#
# 本文件是 nginx 镜像的模板（compose 挂到 /etc/nginx/templates/default.conf.template），
# 启动时只替换 KBS_EDGE_ 开头的环境变量（NGINX_ENVSUBST_FILTER）。
#
# 只接受白名单里的 Host（防 DNS 重绑定：外站域名解析到本机后，Origin 和 Host 都是外站域名）：
# localhost、127.0.0.1、[::1] 加上 KBS_EDGE_HOSTS（空格分隔的主机名或 IP，不带端口，例如
# "kb.example.com 192.0.2.10"）。其他 Host 一律回 421；从别的机器访问时，要把访问用的主机名或 IP 加进去。
#
# WebSocket 只接受本站页面发起的连接（防跨站 WebSocket 劫持，SEC-F4）：Swarm 的 /ws、
# /ws/git 和插件的 /ws/plugins/* 都一样。浏览器发起 WebSocket 一定带 Origin，插件页
# iframe 与 Swarm 同源；Origin 的“主机:端口”必须与请求的 Host 相同（localhost、
# 127.0.0.1、[::1] 端口相同时算同一站点），否则握手回 403，没有 Origin 的也回 403。
# 脚本直连时要带本站 Origin，例如连 ws://127.0.0.1:5199 时带 Origin: http://localhost:5199。
# 这一层挡的是浏览器里的外站页面；非浏览器客户端能伪造 Origin，登录鉴权要由 Swarm 提供。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map "$http_upgrade|$http_origin|$http_host" $ws_foreign_origin {
    default 0;
    "~*^websocket\|https?://([^/|]+)\|\1$" 0;
    "~*^websocket\|https?://(?:localhost|127\.0\.0\.1|\[::1\])(:[0-9]+|)\|(?:localhost|127\.0\.0\.1|\[::1\])\1$" 0;
    "~*^websocket\|" 1;
}

# Host 不在白名单里：不转给 Swarm
server {
    listen 8080 default_server;
    server_name _;
    default_type text/plain;
    return 421 "Host not allowed: add it to KBS_EDGE_HOSTS\n";
}

server {
    listen 8080;
    server_name localhost 127.0.0.1 [::1] ${KBS_EDGE_HOSTS};

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $swarm http://swarm:5173;

    if ($ws_foreign_origin) {
        return 403;
    }

    client_max_body_size 0;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # 网关 WS 和插件 WS 都是长连接；分析结果是流式推送，不缓冲
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
    proxy_buffering off;
    proxy_request_buffering off;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    location ~ "^/api/application-plugins/[^/]+/assets/assets/[^/]+-[A-Za-z0-9_-]{8}\.(js|css|svg|png|woff2?)$" {
        proxy_pass $swarm;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # MCP Apps（对话里的工具卡片）：Swarm 把卡片放进 WebChannel 内部端口上的「另一个源」沙箱页，
    # 那个地址浏览器经本入口访问不到，沙箱页也只认本机回环地址打开的页面。这里让沙箱地址查询返回 404，
    # Swarm 前端就按它自己的后备路径，把卡片放进页面内的 srcdoc 沙箱 iframe。
    location = /api/v1/mcp-app/sandbox {
        return 404;
    }

    location / {
        proxy_pass $swarm;
    }
}
