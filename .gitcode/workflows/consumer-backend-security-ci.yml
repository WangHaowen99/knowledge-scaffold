name: Consumer Backend Security CI

on:
  push:
    branches:
      - develop
      - 'dev-*'
      - 'codex/backend-*'
      - 'codex/security-*'
  pull_request:
    branches:
      - develop

permissions:
  repository: read

jobs:
  backend-security-checks:
    runs-on: {ubuntu-24,x64,medium}
    steps:
      - name: Checkout source code
        uses: checkout
      - name: Set up Python
        uses: setup-python
        with:
          python-version: '3.11'
      - name: Install backend test dependencies
        run: python -m pip install --upgrade pip && pip install -r consumer/backend/requirements.txt pytest
      - name: Run backend sandbox security regression tests
        run: cd consumer && PYTHONPATH=backend python -m pytest backend/tests/test_sandbox.py backend/tests/test_execute_script_sandbox_fallback.py backend/tests/test_nl2sql_template_provider.py backend/tests/test_jiuwenbox_image_build.py deploy/tests/test_preflight_config.py deploy/tests/test_release_compose.py -q
