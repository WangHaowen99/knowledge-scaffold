version: '3.3'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    image: onto-agent-backend:${TAG:-latest}
    container_name: onto-agent-backend-${TAG:-latest}
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5055}:5055"
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ../.onto-runtime:/app/.onto-runtime
    env_file:
      - ./.env
    environment:
      - FLASK_APP=run.py
      - PYTHONUNBUFFERED=1
      - PROJECT_ROOT=/app/.onto-runtime
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:5055/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
