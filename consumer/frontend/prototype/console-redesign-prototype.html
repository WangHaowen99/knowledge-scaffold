<!DOCTYPE html>
<!--
  ⚠️ THROWAWAY PROTOTYPE — 不是生产代码
  问题：按五层配置作用域重设计 console 前端（配置中心三层 IA + 新增知识包工作台），应该长什么样？
  三个结构不同的变体，?variant=A|B|C 切换，底部浮动条或 ←/→ 键切换。
  额外 URL 参数：&surface=kb|config|chat  &role=admin|user
  打开方式：open console-redesign-prototype.html
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>meta-wise console 重设计原型（PROTOTYPE）</title>
<style>
  :root {
    --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
    --hair: #e1e0d9; --border: rgba(11,11,11,.1);
    --blue: #2a78d6; --blue-d: #1c5cab; --blue-dd: #104281; --blue-l: #5598e7; --blue-ll: #cde2fb;
    --aqua: #1baf7a; --good: #0ca30c; --warn: #eda100; --crit: #d03b3b;
    --l1: #5598e7; --l2: #2a78d6; --l3: #1c5cab;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body { font-family: system-ui,-apple-system,"PingFang SC","Segoe UI",sans-serif; color:var(--ink); font-size:14px; }
  #root { height:100%; }
  button { font-family:inherit; cursor:pointer; }
  input,select { font-family:inherit; font-size:13px; }
  ::-webkit-scrollbar { width:8px; height:8px; } ::-webkit-scrollbar-thumb { background:#d5d4cd; border-radius:4px; }

  /* ============ 浮动切换条（评审工具，非设计的一部分） ============ */
  #switcher {
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:9999;
    background:#111; color:#fff; border-radius:99px; padding:8px 10px;
    display:flex; align-items:center; gap:12px; box-shadow:0 8px 24px rgba(0,0,0,.35);
    font-size:13px; user-select:none;
  }
  #switcher button { background:#2c2c2c; color:#fff; border:none; border-radius:99px; width:30px; height:30px; font-size:15px; }
  #switcher button:hover { background:#444; }
  #switcher .lb { min-width:230px; text-align:center; font-weight:600; letter-spacing:.3px; }
  #switcher .lb small { display:block; font-weight:400; color:#9a9a9a; font-size:11px; }

  /* ============ 共享小组件 ============ */
  .scope-badge { font-size:10.5px; font-weight:700; color:#fff; border-radius:5px; padding:1.5px 7px; letter-spacing:.5px; flex:none; }
  .sb-l1 { background:var(--l1);} .sb-l2 { background:var(--l2);} .sb-l3 { background:var(--l3);}
  .tag { font-size:11px; border-radius:99px; padding:2px 9px; font-weight:600; }
  .tag-draft { background:#fbf0d7; color:#7a5200; } .tag-ok { background:#e2f5ed; color:#0e6b4a; }
  .tag-lang { background:#eef1f6; color:#52514e; }
  .ro-banner { display:flex; gap:10px; align-items:center; background:#fbf6e8; border:1px solid #f0e2bb;
    border-radius:10px; padding:10px 14px; font-size:13px; color:#6b5a1e; margin-bottom:16px; }
  .ro-banner b { font-weight:650; }
  .fieldrow { display:flex; align-items:center; gap:14px; padding:11px 0; border-bottom:1px solid #f0efec; }
  .fieldrow:last-child { border-bottom:none; }
  .fieldrow .fl { width:220px; flex:none; }
  .fieldrow .fl .n { font-weight:600; font-size:13.5px; }
  .fieldrow .fl .h { font-size:12px; color:var(--muted); margin-top:2px; line-height:1.4; }
  .fieldrow input[type=text], .fieldrow input[type=password], .fieldrow select {
    flex:1; max-width:420px; border:1px solid var(--hair); border-radius:8px; padding:7px 11px; background:#fff;
  }
  .fieldrow input:disabled, .fieldrow select:disabled { background:#f7f6f3; color:var(--muted); cursor:not-allowed; }
  .fieldrow .ov { font-size:11px; color:var(--muted); }
  .toggle { width:38px; height:22px; border-radius:99px; background:#d8d7d0; position:relative; border:none; flex:none; transition:background .15s; }
  .toggle.on { background:var(--blue); }
  .toggle::after { content:''; position:absolute; top:2.5px; left:3px; width:17px; height:17px; border-radius:50%; background:#fff; transition:left .15s; }
  .toggle.on::after { left:18px; }
  .toggle:disabled { opacity:.55; cursor:not-allowed; }
  .btn { border:1px solid var(--hair); background:#fff; border-radius:8px; padding:7px 15px; font-size:13px; font-weight:600; }
  .btn:hover { border-color:#c9c8c1; }
  .btn-p { background:var(--blue); border-color:var(--blue); color:#fff; }
  .btn-p:hover { background:var(--blue-d); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  table.dt { width:100%; border-collapse:collapse; font-size:13px; }
  table.dt th { text-align:left; font-weight:600; color:var(--ink2); padding:8px 12px; border-bottom:1px solid var(--hair); font-size:12.5px; white-space:nowrap; }
  table.dt td { padding:9px 12px; border-bottom:1px solid #f0efec; vertical-align:top; }
  table.dt tr:last-child td { border-bottom:none; }
  .empty { color:var(--muted); text-align:center; padding:40px 0; font-size:13px; }
  .kb-search { border:1px solid var(--hair); border-radius:9px; padding:8px 12px; width:100%; background:#fff; }

  /* ============================================================
     变体 A — 侧边导航 · 经典控制台
  ============================================================ */
  .va { display:flex; height:100%; background:#f4f5f7; }
  .va .side { width:224px; flex:none; background:#fff; border-right:1px solid #ebeae5; display:flex; flex-direction:column; }
  .va .logo { padding:20px 20px 14px; font-size:17px; font-weight:750; letter-spacing:.3px; display:flex; align-items:center; gap:9px; }
  .va .logo .mk { width:26px; height:26px; border-radius:8px; background:linear-gradient(135deg,var(--blue),var(--blue-dd)); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; }
  .va .nav { padding:8px 12px; flex:1; }
  .va .nav .grp { font-size:11px; color:var(--muted); letter-spacing:1.5px; padding:14px 10px 6px; font-weight:600; }
  .va .nav a { display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:9px; color:var(--ink2); text-decoration:none; font-size:13.5px; font-weight:550; margin-bottom:2px; }
  .va .nav a .ic { width:17px; text-align:center; font-size:15px; }
  .va .nav a:hover { background:#f4f5f7; }
  .va .nav a.on { background:var(--blue-ll); color:var(--blue-dd); font-weight:650; }
  .va .ucard { margin:12px; border:1px solid #ebeae5; border-radius:11px; padding:11px 13px; }
  .va .ucard .un { font-weight:650; font-size:13px; display:flex; gap:8px; align-items:center; }
  .va .main { flex:1; overflow:auto; }
  .va .topbar { height:56px; background:#fff; border-bottom:1px solid #ebeae5; display:flex; align-items:center; padding:0 26px; gap:16px; position:sticky; top:0; z-index:5; }
  .va .topbar .crumb { font-size:14px; font-weight:650; }
  .va .topbar .wswrap { margin-left:auto; position:relative; }
  .va .topbar .ws { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink2); border:1px solid var(--hair); border-radius:9px; padding:6px 12px; background:#fff; cursor:pointer; }
  .va .topbar .ws:hover { border-color:#c9c8c1; }
  .va .wsmenu { position:absolute; top:38px; right:0; width:250px; background:#fff; border:1px solid #e4e3dc; border-radius:12px;
    box-shadow:0 12px 32px rgba(0,0,0,.12); padding:6px; z-index:50; }
  .va .wsmenu .wm-h { font-size:11px; color:var(--muted); letter-spacing:1px; padding:8px 11px 4px; font-weight:600; }
  .va .wsmenu a { display:flex; align-items:center; justify-content:space-between; padding:8px 11px; border-radius:8px; font-size:13px; color:var(--ink); text-decoration:none; }
  .va .wsmenu a:hover { background:#f4f5f7; }
  .va .wsmenu a .cur { color:var(--blue-d); font-weight:700; }
  .va .wsmenu a .default-flag { font-size:11px; color:var(--muted); }
  .va .wsmenu .div { height:1px; background:#efeee9; margin:6px 4px; }
  .va .wsmenu .new { color:var(--blue-d); font-weight:650; }
  .va .content { padding:24px 28px 90px; max-width:1180px; }
  .va .scope-tabs { display:flex; gap:6px; background:#eceef1; border-radius:11px; padding:4px; width:fit-content; margin-bottom:6px; }
  .va .scope-tabs button { border:none; background:transparent; border-radius:8px; padding:8px 18px; font-size:13.5px; font-weight:600; color:var(--ink2); display:flex; gap:8px; align-items:center; }
  .va .scope-tabs button.on { background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .va .scope-hint { font-size:12.5px; color:var(--muted); margin:8px 2px 18px; }
  .va .cfg { display:flex; gap:20px; align-items:flex-start; }
  .va .cfg .subnav { width:190px; flex:none; position:sticky; top:80px; }
  .va .cfg .subnav a { display:block; padding:8px 12px; border-radius:8px; font-size:13px; color:var(--ink2); text-decoration:none; margin-bottom:2px; }
  .va .cfg .subnav a.on { background:#fff; color:var(--ink); font-weight:650; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .va .card { background:#fff; border:1px solid #ebeae5; border-radius:14px; padding:20px 24px; margin-bottom:16px; }
  .va .card h3 { font-size:15.5px; margin-bottom:2px; display:flex; align-items:center; gap:10px; }
  .va .card .cd { font-size:12.5px; color:var(--muted); margin-bottom:10px; }
  .va .card .foot { display:flex; justify-content:flex-end; gap:10px; margin-top:14px; }
  /* A · 知识包 master-detail */
  .va .kb { display:flex; gap:20px; align-items:flex-start; }
  .va .kb .list { width:290px; flex:none; }
  .va .kb .pk { background:#fff; border:1px solid #ebeae5; border-radius:13px; padding:14px 16px; margin-bottom:10px; cursor:pointer; }
  .va .kb .pk:hover { border-color:#c9d8ee; }
  .va .kb .pk.on { border-color:var(--blue); box-shadow:0 0 0 1px var(--blue); }
  .va .kb .pk .pn { font-weight:680; font-size:14px; margin-bottom:4px; }
  .va .kb .pk .pm { font-size:12px; color:var(--muted); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .va .kb .detail { flex:1; background:#fff; border:1px solid #ebeae5; border-radius:14px; overflow:hidden; }
  .va .kb .dhead { padding:20px 24px 0; }
  .va .kb .dhead h2 { font-size:19px; display:flex; gap:12px; align-items:center; }
  .va .kb .dhead .dd { color:var(--ink2); font-size:13px; line-height:1.65; margin:8px 0 14px; max-width:760px; }
  .va .kb .stats { display:flex; gap:26px; margin-bottom:14px; }
  .va .kb .stat .v { font-size:22px; font-weight:750; }
  .va .kb .stat .k { font-size:12px; color:var(--muted); }
  .va .kb .dtabs { display:flex; gap:2px; border-bottom:1px solid #ebeae5; padding:0 16px; }
  .va .kb .dtabs button { border:none; background:none; padding:11px 14px; font-size:13.5px; font-weight:600; color:var(--ink2); border-bottom:2px solid transparent; }
  .va .kb .dtabs button.on { color:var(--blue-d); border-bottom-color:var(--blue); }
  .va .kb .dbody { padding:20px 24px 24px; min-height:340px; }
  .va .chat-ph { background:#fff; border:1px dashed #d5d4cd; border-radius:14px; padding:60px; text-align:center; color:var(--muted); }
  /* A/D · 对话工作台（左历史 + 右对话） */
  .va .chatwrap { display:flex; height:calc(100vh - 118px); border:1px solid #ebeae5; border-radius:14px; overflow:hidden; background:#fff; }
  .va .hist { width:266px; flex:none; border-right:1px solid #ebeae5; background:#fbfbf9; display:flex; flex-direction:column; }
  .va .hist .h-top { padding:14px 14px 10px; display:flex; flex-direction:column; gap:10px; }
  .va .hist .h-list { flex:1; overflow:auto; padding:0 8px 16px; }
  .va .hist .hg { font-size:11px; color:var(--muted); padding:12px 10px 4px; font-weight:600; letter-spacing:1px; }
  .va .hist .hs { padding:9px 10px; border-radius:9px; cursor:pointer; margin-bottom:1px; }
  .va .hist .hs:hover { background:#f0f0ec; }
  .va .hist .hs.on { background:#e3ecfa; }
  .va .hist .hs .t { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .va .hist .hs.on .t { color:var(--blue-dd); }
  .va .hist .hs .m { font-size:11.5px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .va .thread { flex:1; display:flex; flex-direction:column; min-width:0; }
  .va .th-head { padding:13px 22px; border-bottom:1px solid #f0efec; display:flex; align-items:center; gap:10px; }
  .va .th-head .tt { font-size:14.5px; font-weight:700; }
  .va .th-head .tm { font-size:12px; color:var(--muted); }
  .va .th-body { flex:1; overflow:auto; padding:22px 26px 10px; }
  .va .msg { display:flex; margin-bottom:18px; }
  .va .msg.u { justify-content:flex-end; }
  .va .msg.u .bub { background:var(--blue); color:#fff; border-radius:14px 14px 3px 14px; padding:10px 16px; max-width:62%; font-size:13.5px; line-height:1.65; }
  .va .msg.a .bub { background:#f8f8f5; border:1px solid #efeee9; border-radius:3px 14px 14px 14px; padding:14px 18px; max-width:80%; font-size:13.5px; line-height:1.75; }
  .va .msg.a .bub p { margin-bottom:8px; }
  .va .refchips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .va .refchip { font-size:11.5px; background:#fff; border:1px solid var(--hair); border-radius:99px; padding:2.5px 10px; color:var(--ink2); font-weight:600; }
  .va .th-input { border-top:1px solid #f0efec; padding:13px 22px 15px; }
  .va .ti-box { display:flex; gap:10px; align-items:center; border:1px solid var(--hair); border-radius:12px; padding:9px 9px 9px 14px; }
  .va .ti-box:focus-within { border-color:var(--blue-l); }
  .va .ti-box input { flex:1; border:none; outline:none; font-size:13.5px; background:transparent; }
  .va .hints { display:flex; gap:8px; margin-top:9px; align-items:center; }
  .va .hintchip { font-size:12px; border:1px solid var(--hair); border-radius:99px; padding:4px 12px; color:var(--ink2); background:#fff; cursor:pointer; }
  .va .hintchip:hover { border-color:#c9d8ee; color:var(--blue-d); }
  .va .ucard .uact { font-size:12px; color:var(--muted); margin-top:7px; display:flex; gap:12px; }
  .va .ucard .uact a { color:var(--muted); text-decoration:none; cursor:pointer; }
  .va .ucard .uact a:hover { color:var(--ink2); text-decoration:underline; }
  /* 登录页（变体无关） */
  .login { display:flex; height:100%; background:#fafaf8; }
  .login .lbrand { width:44%; min-width:430px; background:linear-gradient(160deg,#0d366b,#2a78d6); color:#fff; padding:58px 56px; display:flex; flex-direction:column; }
  .login .lbrand .mk { width:44px; height:44px; border-radius:12px; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25); display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:800; margin-bottom:26px; }
  .login .lbrand h1 { font-size:30px; font-weight:780; letter-spacing:.5px; margin-bottom:12px; }
  .login .lbrand .tg { font-size:15px; color:rgba(255,255,255,.85); line-height:1.8; max-width:400px; }
  .login .lbrand .feats { margin-top:auto; display:flex; flex-direction:column; gap:18px; }
  .login .lbrand .feat { display:flex; gap:13px; align-items:flex-start; }
  .login .lbrand .feat .fi { width:34px; height:34px; border-radius:9px; background:rgba(255,255,255,.13); display:flex; align-items:center; justify-content:center; font-size:16px; flex:none; }
  .login .lbrand .feat .ft { font-size:14px; font-weight:650; margin-bottom:2px; }
  .login .lbrand .feat .fd { font-size:12.5px; color:rgba(255,255,255,.72); line-height:1.6; }
  .login .lform { flex:1; display:flex; align-items:center; justify-content:center; }
  .login .lcard { width:392px; }
  .login .lcard h2 { font-size:23px; font-weight:750; margin-bottom:6px; }
  .login .lcard .ld { font-size:13.5px; color:var(--muted); margin-bottom:26px; }
  .login .lfield { margin-bottom:16px; }
  .login .lfield label { display:block; font-size:12.5px; font-weight:650; color:var(--ink2); margin-bottom:6px; }
  .login .lfield input { width:100%; border:1px solid var(--hair); border-radius:10px; padding:11px 14px; font-size:14px; background:#fff; }
  .login .lfield input:focus { outline:none; border-color:var(--blue-l); box-shadow:0 0 0 3px rgba(85,152,231,.15); }
  .login .lbtn { width:100%; background:var(--blue); color:#fff; border:none; border-radius:10px; padding:12px; font-size:14.5px; font-weight:650; margin-top:6px; }
  .login .lbtn:hover { background:var(--blue-d); }
  .login .lnote { font-size:12px; color:var(--muted); text-align:center; margin-top:16px; line-height:1.7; }

  /* ============================================================
     变体 B — 顶部导航 · 文档式设置
  ============================================================ */
  .vb { height:100%; overflow:auto; background:#faf9f6; }
  .vb .top { height:60px; background:rgba(250,249,246,.92); backdrop-filter:blur(8px); border-bottom:1px solid #eae8e0;
    display:flex; align-items:center; padding:0 34px; gap:30px; position:sticky; top:0; z-index:10; }
  .vb .brand { font-size:17px; font-weight:780; letter-spacing:.2px; display:flex; gap:9px; align-items:center; }
  .vb .brand .mk { width:24px; height:24px; border-radius:7px; background:var(--ink); color:#fff; font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .vb .tnav { display:flex; gap:4px; }
  .vb .tnav a { text-decoration:none; color:var(--ink2); font-size:14px; font-weight:600; padding:8px 15px; border-radius:99px; }
  .vb .tnav a:hover { background:#f0eee7; }
  .vb .tnav a.on { background:var(--ink); color:#fff; }
  .vb .tright { margin-left:auto; display:flex; align-items:center; gap:12px; font-size:13px; }
  .vb .wschip { border:1px solid #e0ded5; border-radius:99px; padding:6px 14px; background:#fff; color:var(--ink2); }
  .vb .page { max-width:1150px; margin:0 auto; padding:36px 34px 110px; }
  .vb h1.pt { font-size:28px; font-weight:760; letter-spacing:.3px; margin-bottom:6px; }
  .vb .ps { font-size:14.5px; color:var(--ink2); margin-bottom:28px; }
  /* B · 配置中心：左侧大纲 + 右侧长文档 */
  .vb .cfg { display:flex; gap:44px; align-items:flex-start; }
  .vb .outline { width:230px; flex:none; position:sticky; top:96px; }
  .vb .outline .og { margin-bottom:18px; }
  .vb .outline .ogh { display:flex; gap:8px; align-items:center; font-size:12px; font-weight:700; color:var(--ink2); letter-spacing:1px; margin-bottom:6px; padding-left:11px; }
  .vb .outline a { display:flex; justify-content:space-between; align-items:center; padding:6.5px 11px; font-size:13.5px; color:var(--ink2); text-decoration:none; border-left:2px solid #e6e4db; }
  .vb .outline a:hover { color:var(--ink); }
  .vb .outline a.on { color:var(--ink); font-weight:680; border-left-color:var(--ink); }
  .vb .outline a .lock { font-size:11px; color:#b6b4ab; }
  .vb .doc { flex:1; min-width:0; }
  .vb .sec { background:#fff; border:1px solid #eae8e0; border-radius:16px; padding:26px 30px; margin-bottom:20px; }
  .vb .sec .shead { display:flex; align-items:baseline; gap:12px; margin-bottom:4px; }
  .vb .sec h2 { font-size:19px; font-weight:720; }
  .vb .sec .sd { font-size:13px; color:var(--muted); margin-bottom:12px; }
  .vb .sec .foot { display:flex; justify-content:space-between; align-items:center; margin-top:16px; }
  .vb .sec .foot .who { font-size:12px; color:var(--muted); }
  /* B · 知识包：卡片画廊 → 详情 */
  .vb .gal { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
  .vb .gcard { background:#fff; border:1px solid #eae8e0; border-radius:16px; padding:22px 24px; cursor:pointer; transition:transform .12s, box-shadow .12s; }
  .vb .gcard:hover { transform:translateY(-2px); box-shadow:0 10px 28px rgba(20,20,10,.08); }
  .vb .gcard .gi { width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; margin-bottom:14px; }
  .vb .gcard h3 { font-size:16px; font-weight:700; margin-bottom:6px; }
  .vb .gcard .gd { font-size:12.5px; color:var(--ink2); line-height:1.6; height:60px; overflow:hidden; margin-bottom:12px; }
  .vb .gcard .gm { display:flex; gap:14px; font-size:12px; color:var(--muted); border-top:1px solid #f0eee7; padding-top:12px; }
  .vb .gcard .gm b { color:var(--ink); font-weight:700; font-size:14px; }

/* 轻量 Markdown 渲染（标题/粗斜体/行内码/围栏代码/表格/列表/引用/分隔线/链接） */
function mdToHtml(src) {
  const e = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const inline = t => t
    .replace(/`([^`]+)`/g, (m,c)=>'<code>'+c+'</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*\s][^*]*)\*/g,'<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" onclick="return false">$1</a>');
  const lines = String(src).split('\n');
  let html='', i=0, inUl=false, inOl=false, para=[];
  const flushP = () => { if (para.length) { html += '<p>'+inline(para.join(' '))+'</p>'; para=[]; } };
  const closeL = () => { if (inUl) { html+='</ul>'; inUl=false; } if (inOl) { html+='</ol>'; inOl=false; } };
  while (i < lines.length) {
    const raw = lines[i];
    if (/^```/.test(raw)) { flushP(); closeL();
      const lang = raw.slice(3).trim(); const code=[]; i++;
      while (i<lines.length && !/^```/.test(lines[i])) { code.push(lines[i]); i++; }
      i++; html += `<pre data-lang="${lang}"><code>${e(code.join('\n'))}</code></pre>`; continue; }
    const l = e(raw);
    if (/^\s*$/.test(l)) { flushP(); closeL(); i++; continue; }
    let m;
    if (m = l.match(/^(#{1,4})\s+(.*)/)) { flushP(); closeL(); const n=m[1].length; html+=`<h${n}>${inline(m[2])}</h${n}>`; i++; continue; }
    if (/^---+\s*$/.test(l)) { flushP(); closeL(); html+='<hr>'; i++; continue; }
    if (m = l.match(/^&gt;\s?(.*)/)) { flushP(); closeL(); html+=`<blockquote>${inline(m[1])}</blockquote>`; i++; continue; }
    if (raw.includes('|') && i+1 < lines.length && lines[i+1].includes('-') && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1])) {
      flushP(); closeL();
      const cells = r => e(r).replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>inline(c.trim()));
      html += '<table><thead><tr>'+cells(raw).map(c=>`<th>${c}</th>`).join('')+'</tr></thead><tbody>';
      i += 2;
      while (i<lines.length && lines[i].includes('|') && lines[i].trim()) { html+='<tr>'+cells(lines[i]).map(c=>`<td>${c}</td>`).join('')+'</tr>'; i++; }
      html += '</tbody></table>'; continue; }
    if (m = l.match(/^\s*[-*]\s+(.*)/)) { flushP(); if (inOl){html+='</ol>';inOl=false;} if (!inUl){html+='<ul>';inUl=true;} html+=`<li>${inline(m[1])}</li>`; i++; continue; }
    if (m = l.match(/^\s*\d+[.、]\s+(.*)/)) { flushP(); if (inUl){html+='</ul>';inUl=false;} if (!inOl){html+='<ol>';inOl=true;} html+=`<li>${inline(m[1])}</li>`; i++; continue; }
    para.push(l); i++;
  }
  flushP(); closeL();
  return html;
}

function fieldHTML(f, editable) {
  const dis = editable ? '' : 'disabled';
  let ctrl = '';
  if (f.t === 'text') ctrl = `<input type="text" value="${esc(f.v)}" ${dis}>`;
  else if (f.t === 'secret') ctrl = `<input type="password" value="12345678900" placeholder="${esc(f.v)}" ${dis}>`;
  else if (f.t === 'select') ctrl = `<select ${dis}>${f.opts.map(o=>`<option ${o===f.v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  else if (f.t === 'toggle') ctrl = `<button class="toggle ${f.v?'on':''}" data-action="toggle" ${dis}></button>`;
  else if (f.t === 'static') ctrl = `<span style="font-size:13px;color:var(--ink2)">${esc(f.v)}</span>`;
  else if (f.t === 'action') ctrl = `<button class="btn ${f.primary?'btn-p':''}" ${editable?'':'disabled'}>${esc(f.v)}</button>`;
  return `<div class="fieldrow"><div class="fl"><div class="n">${esc(f.n)}</div>${f.h?`<div class="h">${esc(f.h)}</div>`:''}</div>${ctrl}</div>`;
}

                   <span><button class="btn">重置</button> <button class="btn btn-p">保存修改</button></span></div>`:''}
              </div>`;}).join('')}`).join('')}
        </div>
      </div>`;
  }
  root.innerHTML = `<div class="vb">
    <div class="top">
      <div class="brand"><span class="mk">M</span>meta-wise</div>
      <div class="tnav">
        ${Object.entries(SURFACES).map(([k,l])=>`<a href="#" data-action="surface" data-v="${k}" class="${state.surface===k?'on':''}">${l}</a>`).join('')}
      </div>
      <div class="tright"><span class="wschip">🗂 domain-example ▾</span>${roleSwitch()}</div>
    </div>
    <div class="page">${page}</div>
  </div>`;
}

/* ===================== C 的知识包三栏浏览器（C 与 D 共用） ===================== */
function cKbBody() {
  const p = PACKAGES[state.pkg];
  const kinds = [['objects','业务对象'],['operations','操作'],['scripts','脚本']];
  const list = p[state.cKind] || [];
  const cur = list[state.cObj] || list[0];
  return `<div class="exp">
      <div class="expcol1">
        <div class="pkh">知识包 ${isAdmin()?'<button class="btn" id="kb-import-btn" style="float:right;padding:2px 9px;font-size:11px">＋ 导入</button>':''}</div>
        ${PACKAGES.map((pk,i)=>`<div class="pnode">
          <div class="pn-h ${i===state.pkg?'on':''}" data-action="pick-pkg" data-i="${i}">
            <span class="caret">${i===state.pkg?'▾':'▸'}</span>${pk.icon} ${esc(pk.name)}</div>
          ${i===state.pkg?`<div class="pkids">
            ${kinds.map(([k,l])=>`<a href="#" data-action="c-kind" data-v="${k}" class="${state.cKind===k?'on':''}">${l}<span class="cnt">${(pk[k]||[]).length}${k==='objects'&&pk.stats.objects>(pk[k]||[]).length?'/'+pk.stats.objects:''}</span></a>`).join('')}
            <a href="#" data-action="c-kind" data-v="overview" class="${state.cKind==='overview'?'on':''}">概览与边界</a>
          </div>`:''}
        </div>`).join('')}
      </div>
      ${state.cKind==='overview' ? `<div class="expcol3">
          <div class="doc-h">${p.icon} ${esc(p.name)}</div>
          <div class="doc-sub">${p.id} · v${p.ver} · ${p.status} · 绑定 ${p.boundConn}</div>
          <div class="md">${pkgTabBody({...p}) /* overview 用 pkgTab 状态 */}</div>
        </div>` : `
      <div class="expcol2">
        <input class="kb-search" style="margin-bottom:10px" placeholder="筛选…">
        ${list.map((o,i)=>`<div class="lrow ${i===(state.cObj<list.length?state.cObj:0)?'on':''}" data-action="pick-obj" data-i="${i}">
          <div class="ln">${state.cKind==='objects'?'▤':state.cKind==='operations'?'⚙':'𝑓'} ${esc(o.k)}</div>
          <div class="ld">${esc(o.d)}</div></div>`).join('') || '<div class="empty">空</div>'}
      </div>
      <div class="expcol3">
        ${cur ? `
          <div class="doc-h">${state.cKind==='objects'?'▤':state.cKind==='operations'?'⚙':'𝑓'} ${esc(cur.k)}
            <span class="viewtog">
              <button data-action="kb-view" data-v="render" class="${state.kbView!=='source'?'on':''}">渲染</button>
              <button data-action="kb-view" data-v="source" class="${state.kbView==='source'?'on':''}">源码</button>
            </span></div>
          <div class="doc-sub">${p.id}/${state.cKind}/${esc(cur.k)}.md</div>
          ${state.kbView==='source'
            ? `<pre class="srcview">${esc(itemMd(cur))}</pre>`
            : `<div class="mdv" style="max-width:820px">${mdToHtml(itemMd(cur))}</div>`}` : '<div class="empty">选择左侧条目查看内容</div>'}
      </div>`}
    </div>`;
}

function renderC(root) {
  let body = '';
  if (state.surface === 'chat') body = `<div class="chat-ph">对话工作台（原型占位）</div>`;
  if (state.surface === 'kb') body = cKbBody();
  if (state.surface === 'config') {
    const sc = CONFIG[state.cfgScope];
    const sec = sc.sections.find(s=>s.id===state.cfgSec) || sc.sections[0];
    body = `<div class="cfgwrap"><div class="cfgcols">
      <div class="cfgtree">
        <div class="searchbox"><input class="kb-search" placeholder="搜索配置项…  ⌘K"></div>
        ${Object.entries(CONFIG).map(([k,v])=>`<div class="tg">
          <div class="tgh"><span class="scope-badge ${v.badge}">${v.lv}</span>${v.label}${!canEditScope(k)?' 🔒':''}</div>
          ${v.sections.map(s=>`<a href="#" data-action="cfg-jump" data-scope="${k}" data-v="${s.id}"
            class="${state.cfgScope===k&&state.cfgSec===s.id?'on':''}">${esc(s.name)}<span class="cnt">${s.fields.length}</span></a>`).join('')}
        </div>`).join('')}
      </div>
      <div class="cfgpane">
        <div class="ph"><span class="scope-badge ${sc.badge}">${sc.lv}</span><h2>${esc(sec.name)}</h2></div>
        <div class="pd">${esc(sec.desc||'')} · ${esc(sc.hint)}</div>
        ${roBanner(state.cfgScope)}
        <div class="itemcard">${sec.fields.map(f=>fieldHTML(f, canEditScope(state.cfgScope) && f.t!=='static')).join('')}</div>
        ${canEditScope(state.cfgScope)?`<div class="savebar"><button class="btn">重置</button><button class="btn btn-p">保存修改</button></div>`:''}
      </div>
    </div></div>`;
  }
  root.innerHTML = `<div class="vc">
    <div class="rail">
      <div class="mk">M</div>
      <button data-action="surface" data-v="chat" class="${state.surface==='chat'?'on':''}" title="对话工作台">💬</button>
      <button data-action="surface" data-v="kb" class="${state.surface==='kb'?'on':''}" title="知识包工作台">📦</button>
      <button data-action="surface" data-v="config" class="${state.surface==='config'?'on':''}" title="配置中心">⚙️</button>
      <div class="sp"></div>
      <div class="avatar">${isAdmin()?'A':'B'}</div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;min-width:0">
      <div class="head"><span class="t">${SURFACES[state.surface]}</span>
        <span style="font-size:12.5px;color:var(--muted)">🗂 domain-example</span>
        <span style="margin-left:auto"></span>${roleSwitch()}</div>
      <div class="body">${body}</div>
    </div>
  </div>`;
}

/* ===================== 变体 D — 胜出组合：A 的外壳与配置中心 + C 的知识包三栏浏览器 ===================== */
function renderD(root) {
  renderA(root, () => `<div class="vc" style="display:flex;height:calc(100vh - 118px);border:1px solid #ebeae5;border-radius:14px;overflow:hidden;background:#fff">${cKbBody()}</div>`);
}

/* ===================== 登录页（变体无关；登录后弹出蒙版向导） ===================== */
function loginHTML() {
  return `<div class="login">
    <div class="lbrand">
      <div class="mk">M</div>
      <h1>meta-wise</h1>
      <div class="tg">企业本体驱动的 Agent 工作台。把领域知识包、业务数据和多 Agent 编排放进同一个工作空间。</div>
      <div class="feats">
        <div class="feat"><div class="fi">📦</div><div><div class="ft">知识包驱动</div><div class="fd">业务对象、操作与受控脚本按包导入，语义与口径可追溯</div></div></div>
        <div class="feat"><div class="fi">🔌</div><div><div class="ft">连接真实数据</div><div class="fd">对象经映射直查业务库，不编造字段与指标</div></div></div>
        <div class="feat"><div class="fi">🛡️</div><div><div class="ft">分层配置与权限</div><div class="fd">全局 / 空间 / 个人三层作用域，按角色最小授权</div></div></div>
      </div>
    </div>
    <div class="lform">
      <div class="lcard">
        <h2>欢迎回来</h2>
        <div class="ld">登录 meta-wise 控制台</div>
        <div class="lfield"><label>用户名</label><input value="${isAdmin()?'admin':'bob'}"></div>
        <div class="lfield"><label>密码</label><input type="password" value="12345678900"></div>
        <button class="lbtn" data-action="do-login">登 录</button>
        <div class="lnote">首次登录将要求修改初始密码 · 登录即代表同意平台使用规范<br>
          <span style="color:#b6b4ab">（原型提示：登录后会弹出蒙版操作向导）</span></div>
      </div>
    </div>
  </div>`;
}

/* ===================== 操作向导（蒙版聚光灯式：每步跳转到真实页面并高亮目标元素） ===================== */
function wizardSteps() {
  return isAdmin() ? [
    {ic:'👋', t:'欢迎使用 meta-wise', d:'接下来用几步蒙版引导带你完成平台初始化：<b>配置模型 → 连接数据 → 导入知识包 → 绑定数据</b>。可随时跳过，之后从顶栏 ❓ 重新打开。'},
    {ic:'🧠', t:'第 1 步 · 配置模型', d:'高亮处是<b>全局模型池</b>：在这里添加模型 profile、设置全局默认。密钥只保存在全局层，各工作空间通过“模型选用”引用，不接触密钥。',
      apply:{surface:'config',scope:'global',sec:'llm'}, target:'#sec-llm, #bsec-global-llm'},
    {ic:'🔌', t:'第 2 步 · 连接数据', d:'高亮处是当前工作空间的<b>数据连接</b>：新建业务数据库连接，知识包将通过它查询真实业务数据。',
      apply:{surface:'config',scope:'workspace',sec:'conn'}, target:'#sec-conn, #bsec-workspace-conn'},
    {ic:'📦', t:'第 3 步 · 导入知识包', d:'点高亮的按钮导入 .zip 知识包，左侧树会出现包内的<b>业务对象 / 操作 / 脚本</b>，右侧可逐个查看内容。',
      apply:{surface:'kb'}, target:'#kb-import-btn'},
    {ic:'🔗', t:'第 4 步 · 知识与数据绑定', d:'高亮处把<b>知识包映射到数据连接</b>——绑定后，知识包中的业务对象才能查询真实业务数据。',
      apply:{surface:'config',scope:'workspace',sec:'bind'}, target:'#sec-bind, #bsec-workspace-bind'},
    {ic:'💬', t:'一切就绪', d:'从高亮的入口进入<b>对话工作台</b>，试试知识包的典型问题，例如：“CHANGE_ORDER 设计变更的综合影响、成本和周期如何分析？”',
      target:'[data-action="surface"][data-v="chat"]'},
  ] : [
    {ic:'👋', t:'欢迎使用 meta-wise', d:'用几步蒙版引导快速了解三个区域：<b>对话工作台、知识包工作台、配置中心</b>（对你只读开放）。可随时跳过。'},
    {ic:'📦', t:'知识包工作台', d:'高亮入口进入<b>知识包工作台</b>：查看已导入知识包的业务对象、操作和典型问题，了解平台能回答什么。',
      apply:{surface:'kb'}, target:'[data-action="surface"][data-v="kb"]'},
    {ic:'⚙️', t:'个人设置', d:'配置中心对你只读；但高亮处的<b>个人偏好</b>（默认工作空间、回复语言）可以自己修改，随账号保存。',
      apply:{surface:'config',scope:'personal',sec:'prefs'}, target:'#sec-prefs, #bsec-personal-prefs'},
    {ic:'💬', t:'开始对话', d:'选好工作空间后从高亮入口直接提问，例如知识包里的典型问题：“TargetItem 对应哪些 SourceItem 版本？”',
      target:'[data-action="surface"][data-v="chat"]'},
  ];
}
function applyWizStep() {
  const steps = wizardSteps();
  const s = steps[Math.min(state.wizStep, steps.length - 1)];
  if (s && s.apply) {
    if (s.apply.surface) state.surface = s.apply.surface;
    if (s.apply.scope) { state.cfgScope = s.apply.scope; state.cfgSec = s.apply.sec; }
  }
}
function renderWizardOverlay(root) {
  const steps = wizardSteps();
  const i = Math.min(state.wizStep, steps.length - 1);
  const s = steps[i];
  const card = `
    <div class="wzc-head"><span class="wz-step">操作向导 · ${i+1} / ${steps.length}</span>
      <button class="wz-skip" data-action="wiz-skip">跳过向导</button></div>
    <div class="wzc-t">${s.ic} ${s.t}</div>
    <div class="wzc-d">${s.d}</div>
    <div class="wz-dots">${steps.map((_,k)=>`<span class="${k===i?'on':''}"></span>`).join('')}</div>
    <div class="wzc-foot">
      <button class="btn" data-action="wiz-prev" ${i===0?'disabled':''}>上一步</button>
      <button class="btn btn-p" data-action="wiz-next">${i===steps.length-1?'完成':'下一步'}</button>
    </div>`;
  const t = s.target ? root.querySelector(s.target) : null;
  if (!t) {  // 欢迎页或找不到目标（如 B/C 变体缺该元素）→ 居中卡片
    root.insertAdjacentHTML('beforeend', `<div class="wiz-ov"><div class="wizc" style="width:460px">${card}</div></div>`);
    return;
  }
  t.scrollIntoView({ block:'center', behavior:'auto' });
  const r = t.getBoundingClientRect();
  const pad = 8, hx = r.left - pad, hy = r.top - pad, hw = r.width + pad*2, hh = r.height + pad*2;
  const tipW = 420, tipH = 230, gap = 14;
  const below = hy + hh + gap;
  const tipTop = (below + tipH < innerHeight - 12) ? below : Math.max(12, hy - tipH - gap);
  const tipLeft = Math.min(Math.max(12, hx), innerWidth - tipW - 12);
  root.insertAdjacentHTML('beforeend', `<div class="wiz-mask">
    <div class="wiz-hole" style="left:${hx}px;top:${hy}px;width:${hw}px;height:${hh}px"></div>
    <div class="wizc" style="position:fixed;left:${tipLeft}px;top:${tipTop}px">${card}</div>
  </div>`);
}
function wizardDone() { state.wizOpen = false; try { sessionStorage.setItem('mw_wizard_seen','1'); } catch(e){} }

/* ===================== 渲染与事件 ===================== */
const renderers = { A: renderA, B: renderB, C: renderC, D: renderD };
function render() {
  syncURL();
  const root = document.getElementById('root');
  if (state.surface === 'login') { root.innerHTML = loginHTML(); }
  else {
    renderers[state.variant](root);
    if (state.wizOpen) renderWizardOverlay(root);
  }
  document.getElementById('sw-label').innerHTML =
    `${state.variant} — ${VARIANTS[state.variant]}<small>?variant= 切换 · ←/→ 键 · 右上角可切角色</small>`;
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) { if (state.wsMenu) { state.wsMenu = false; render(); } return; }
  const a = el.dataset.action;
  if (a === 'wiz-skip') { wizardDone(); render(); return; }
  if (a === 'wiz-prev') { state.wizStep = Math.max(0, state.wizStep - 1); applyWizStep(); render(); return; }
  if (a === 'wiz-next') {
    if (state.wizStep >= wizardSteps().length - 1) wizardDone(); else { state.wizStep++; applyWizStep(); }
    render(); return; }
  if (a === 'wiz-open') { e.preventDefault(); state.wizOpen = true; state.wizStep = 0; render(); return; }
  if (a === 'logout') { e.preventDefault(); state.surface = 'login'; state.wizOpen = false; render(); return; }
  if (a === 'do-login') { state.surface = 'chat'; state.wizOpen = true; state.wizStep = 0; render(); return; }
  if (a === 'pick-session') { state.chatSession = +el.dataset.i; render(); return; }
  if (a === 'kb-view') { state.kbView = el.dataset.v; render(); return; }
  if (a === 'ws-menu') { e.preventDefault(); state.wsMenu = !state.wsMenu; render(); return; }
  if (a === 'ws-new' || a === 'ws-manage') { e.preventDefault(); state.wsMenu = false;
    state.surface = 'config'; state.cfgScope = 'global'; state.cfgSec = 'wsmgmt'; render(); return; }
  if (state.wsMenu) state.wsMenu = false;
  if (a==='prev-variant'||a==='next-variant') {
    const ks = Object.keys(VARIANTS); let i = ks.indexOf(state.variant);
    state.variant = ks[(i + (a==='next-variant'?1:ks.length-1)) % ks.length];
  }
  else if (a==='surface') { e.preventDefault(); state.surface = el.dataset.v; }
  else if (a==='role') { state.role = el.dataset.v; }
  else if (a==='pick-pkg') { state.pkg = +el.dataset.i; state.pkgTab='overview'; state.cObj=0; state.cKind='objects'; }
  else if (a==='drill-pkg') { state.pkg = +el.dataset.i; state.pkgDrill = true; state.pkgTab='overview'; }
  else if (a==='undrill') { state.pkgDrill = false; }
  else if (a==='pkg-tab') { state.pkgTab = el.dataset.v; }
  else if (a==='pick-obj') { state.cObj = +el.dataset.i; }
  else if (a==='c-kind') { e.preventDefault(); state.cKind = el.dataset.v; state.cObj = 0; state.pkgTab='overview'; }
  else if (a==='cfg-scope') { state.cfgScope = el.dataset.v; state.cfgSec = CONFIG[el.dataset.v].sections[0].id; }
  else if (a==='cfg-sec') { e.preventDefault(); state.cfgSec = el.dataset.v; }
  else if (a==='cfg-jump') { e.preventDefault(); state.cfgScope = el.dataset.scope; state.cfgSec = el.dataset.v;
    render(); const t = document.getElementById(`bsec-${el.dataset.scope}-${el.dataset.v}`); if (t) t.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  else if (a==='toggle') { el.classList.toggle('on'); return; }
  else if (a==='goto-op') { e.preventDefault(); state.pkgTab='operations'; }
  else return;
  render();
});
document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return;
  if (state.wizOpen) {  // 向导打开时，←/→ 翻步骤
    if (e.key==='ArrowLeft') { state.wizStep = Math.max(0, state.wizStep - 1); applyWizStep(); render(); }
    if (e.key==='ArrowRight') {
      if (state.wizStep >= wizardSteps().length - 1) wizardDone(); else { state.wizStep++; applyWizStep(); }
      render(); }
    return;
  }
  const ks = Object.keys(VARIANTS); let i = ks.indexOf(state.variant);
  if (e.key==='ArrowLeft') { state.variant = ks[(i+ks.length-1)%ks.length]; render(); }
  if (e.key==='ArrowRight') { state.variant = ks[(i+1)%ks.length]; render(); }
});
if (state.wizOpen) applyWizStep();
render();
</script>
</body>
