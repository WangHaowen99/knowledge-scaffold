version: '3.3'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: onto-agent-frontend:${TAG:-latest}
    container_name: onto-agent-frontend-${TAG:-latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8888}:80"
    volumes:
      - ./logs/nginx:/var/log/nginx
    environment:
      - NGINX_BACKEND_UPSTREAM=${NGINX_BACKEND_UPSTREAM:-http://localhost:5055}
      - NGINX_TYPEDB_UPSTREAM=${NGINX_TYPEDB_UPSTREAM:-http://localhost:9991}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 5
