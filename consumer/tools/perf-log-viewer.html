<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Perf Log Viewer</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1020;
        --panel: #131a2e;
        --panel-soft: #18223d;
        --panel-hover: #202b4b;
        --text: #eef3ff;
        --muted: #9eaccf;
        --border: rgba(173, 192, 255, 0.14);
        --accent: #6ea8fe;
        --accent-2: #7ef0c4;
        --warn: #f8cc6b;
        --danger: #ff7b91;
        --shadow: 0 14px 40px rgba(0, 0, 0, 0.3);
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background:
          radial-gradient(
            circle at top right,
            rgba(110, 168, 254, 0.18),
            transparent 24%
          ),
          radial-gradient(
            circle at left bottom,
            rgba(126, 240, 196, 0.14),
            transparent 18%
          ),
          var(--bg);
        color: var(--text);
      }

      .page {
        width: min(1480px, calc(100vw - 32px));
        margin: 24px auto 48px;
      }

      .hero,
      .panel {
        background: rgba(19, 26, 46, 0.88);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
      }

      .hero {
        padding: 24px;
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
      }

      .title {
        margin: 0 0 10px;
        font-size: 30px;
        line-height: 1.15;
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
        font-size: 14px;
      }

      .drop-zone {
        border: 1.5px dashed rgba(126, 240, 196, 0.45);
        background: rgba(126, 240, 196, 0.05);
        border-radius: 18px;
        min-height: 190px;
        padding: 18px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 12px;
        transition: 0.2s ease;
      }

      .drop-zone.dragover {
        background: rgba(110, 168, 254, 0.11);
        border-color: rgba(110, 168, 254, 0.75);
        transform: translateY(-1px);
      }

      .drop-title {
        font-size: 18px;
        font-weight: 700;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      button,
      .button-like,
      select,
      input[type='search'] {
        border: 1px solid var(--border);
        background: var(--panel-soft);
        color: var(--text);
        border-radius: 12px;
        padding: 10px 14px;
        font: inherit;
      }

      button,
      .button-like {
        cursor: pointer;
      }

      button:hover,
      .button-like:hover {
        background: var(--panel-hover);
      }

      input[type='file'] {
        display: none;
      }

      .meta-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 12px;
      }

      .meta-card {
        padding: 14px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      .meta-card .label,
      .label {
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .meta-card .value {
        margin-top: 8px;
        font-size: 18px;
        font-weight: 700;
      }

      .layout {
        display: grid;
        grid-template-columns: 340px minmax(0, 1fr);
        gap: 20px;
        align-items: start;
      }

      .layout > aside {
        position: sticky;
        top: 16px;
      }

      .panel {
        padding: 18px;
      }

      .section-title {
        margin: 0 0 14px;
        font-size: 18px;
      }

      .helper {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }

      .runs-header {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 12px;
      }

      .runs-header input,
      .runs-header select {
        width: 100%;
      }

      .run-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: calc(100vh - 200px);
        overflow-y: auto;
        padding-right: 4px;
      }

      .run-item {
        border: 1px solid rgba(255, 255, 255, 0.07);
        background: rgba(255, 255, 255, 0.03);
        border-radius: 16px;
        padding: 14px;
        cursor: pointer;
        transition: 0.16s ease;
      }

      .run-item:hover,
      .run-item.active {
        background: rgba(110, 168, 254, 0.12);
        border-color: rgba(110, 168, 254, 0.35);
      }

      .run-item .id {
        font-size: 13px;
        font-weight: 700;
        line-height: 1.4;
        word-break: break-all;
      }

      .run-item .summary {
        margin-top: 8px;
        color: var(--muted);
        font-size: 12px;
        display: grid;
        gap: 4px;
      }

      .grid {
        display: grid;
        gap: 16px;
      }

      .grid.two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .grid.three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .grid.four {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .stat-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 16px;
        padding: 16px;
      }

      .stat-card .num {
        margin-top: 8px;
        font-size: 26px;
        font-weight: 800;
      }

      .stat-card .sub {
        margin-top: 8px;
        color: var(--muted);
        font-size: 12px;
      }

      .stack-bars {
        display: flex;
        height: 18px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        margin-top: 14px;
      }

      .stack-bars > div {
        height: 100%;
      }
      .llm {
        background: linear-gradient(90deg, #6ea8fe, #8ab6ff);
      }
      .tools {
        background: linear-gradient(90deg, #7ef0c4, #98f7df);
      }
      .prompt {
        background: linear-gradient(90deg, #f8cc6b, #ffe08d);
      }
      .other {
        background: linear-gradient(90deg, #ff7b91, #ff98ab);
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 12px;
        color: var(--muted);
        font-size: 12px;
      }

      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        display: inline-block;
      }

      .bar-list {
        display: grid;
        gap: 10px;
      }

      .bar-row {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr) 90px;
        gap: 12px;
        align-items: center;
      }

      .bar-track {
        height: 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        overflow: hidden;
      }

      .bar-fill {
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(
          90deg,
          rgba(110, 168, 254, 0.85),
          rgba(126, 240, 196, 0.9)
        );
      }

      .table-wrap {
        overflow: auto;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 900px;
        font-size: 13px;
      }

      th,
      td {
        padding: 12px 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        text-align: left;
        vertical-align: top;
      }

      th {
        position: sticky;
        top: 0;
        background: #18223d;
        z-index: 1;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 11px;
        background: rgba(110, 168, 254, 0.15);
        color: #bed6ff;
        border: 1px solid rgba(110, 168, 254, 0.22);
        white-space: nowrap;
      }
      .tag--neutral,
      .tag--progress {
        background: rgba(110, 168, 254, 0.15);
        color: #bed6ff;
        border-color: rgba(110, 168, 254, 0.22);
      }
      .tag--success {
        background: rgba(126, 240, 196, 0.14);
        color: #c4ffea;
        border-color: rgba(126, 240, 196, 0.24);
      }
      .tag--warn {
        background: rgba(248, 204, 107, 0.14);
        color: #ffe3a0;
        border-color: rgba(248, 204, 107, 0.24);
      }
      .tag--danger {
        background: rgba(255, 123, 145, 0.14);
        color: #ffc1cc;
        border-color: rgba(255, 123, 145, 0.24);
      }

      .status-note {
        margin-top: 16px;
        padding: 16px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      .status-grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        margin-top: 12px;
      }

      .status-card {
        padding: 14px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      .status-card .helper + .helper {
        margin-top: 6px;
      }

      .muted {
        color: var(--muted);
      }
      .danger {
        color: var(--danger);
      }
      .warn {
        color: var(--warn);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .empty {
        padding: 40px 28px;
        text-align: center;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.8;
      }
      .empty svg {
        margin-bottom: 12px;
        opacity: 0.5;
      }

      .top-gap {
        margin-top: 18px;
      }

      /* === Count-up animation === */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .stat-card,
      .meta-card {
        animation: fadeInUp 0.4s ease both;
      }
      .stat-card:nth-child(2),
      .meta-card:nth-child(2) {
        animation-delay: 0.06s;
      }
      .stat-card:nth-child(3),
      .meta-card:nth-child(3) {
        animation-delay: 0.12s;
      }
      .stat-card:nth-child(4),
      .meta-card:nth-child(4) {
        animation-delay: 0.18s;
      }

      /* === Drop zone breathing === */
      @keyframes breathe {
        0%,
        100% {
          border-color: rgba(126, 240, 196, 0.3);
        }
        50% {
          border-color: rgba(126, 240, 196, 0.6);
        }
      }
      .drop-zone:not(.dragover) {
        animation: breathe 3s ease-in-out infinite;
      }

      /* === Table zebra + hover === */
      tbody tr {
        transition: background 0.15s ease;
      }
      tbody tr:nth-child(even) {
        background: rgba(255, 255, 255, 0.02);
      }
      tbody tr:hover {
        background: rgba(110, 168, 254, 0.08) !important;
      }

      /* === Heat-map cell === */
      .heat-warm {
        color: var(--warn);
      }
      .heat-hot {
        color: var(--danger);
        font-weight: 700;
      }

      /* === Tooltip === */
      .has-tip {
        position: relative;
        cursor: default;
      }
      .has-tip .tip {
        position: absolute;
        left: 50%;
        bottom: calc(100% + 8px);
        transform: translateX(-50%) scale(0.92);
        background: #1e2846;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 12px;
        font-size: 12px;
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        transition:
          opacity 0.18s,
          transform 0.18s;
        z-index: 10;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }
      .has-tip:hover .tip {
        opacity: 1;
        transform: translateX(-50%) scale(1);
      }

      /* === Collapsible sections === */
      .collapse-header {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        user-select: none;
      }
      .collapse-header::before {
        content: '▾';
        display: inline-block;
        transition: transform 0.2s;
        font-size: 12px;
        color: var(--muted);
      }
      .collapse-header.collapsed::before {
        transform: rotate(-90deg);
      }
      .collapse-body {
        overflow: hidden;
        transition:
          max-height 0.3s ease,
          opacity 0.3s ease;
      }
      .collapse-body.hidden {
        max-height: 0 !important;
        opacity: 0;
        padding-top: 0;
        padding-bottom: 0;
      }

      /* === Mini stack bar in run list === */
      .mini-stack {
        display: flex;
        height: 4px;
        border-radius: 4px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.06);
        margin-top: 8px;
      }
      .mini-stack > div {
        height: 100%;
      }

      /* === Run item enter animation === */
      .run-item {
        animation: fadeInUp 0.25s ease both;
      }

      /* === Bar fill animation === */
      .bar-fill {
        animation: barGrow 0.5s ease both;
        transform-origin: left;
      }
      @keyframes barGrow {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }
      .stack-bars > div {
        animation: barGrow 0.6s ease both;
        transform-origin: left;
      }

      /* === Filter pills === */
      .filter-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 12px;
      }
      .filter-pill {
        padding: 5px 12px;
        border-radius: 999px;
        font-size: 11px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition: 0.15s ease;
      }
      .filter-pill:hover,
      .filter-pill.active {
        background: rgba(110, 168, 254, 0.15);
        color: var(--accent);
        border-color: rgba(110, 168, 254, 0.35);
      }

      /* === Scrollbar === */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.22);
      }

      /* === Panel header icon === */
      .icon-title {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .icon-title svg {
        flex-shrink: 0;
      }

      @media (max-width: 1100px) {
        .hero,
        .layout,
        .grid.two,
        .grid.three,
        .grid.four {
          grid-template-columns: 1fr;
        }

        .bar-row {
          grid-template-columns: 1fr;
        }

        .run-list {
          max-height: none;
        }
        .layout > aside {
          position: static;
          max-height: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <section class="hero">
        <div>
          <h1 class="title">性能日志解析页</h1>
          <p class="subtitle">
            上传 `agent_perf*.log` 这类 JSON Lines 日志后，页面会自动按 `run_id`
            聚合，帮助你快速看出 每次运行的时间主要花在
            <strong>LLM</strong>、<strong>工具批执行</strong>、<strong
              >prompt 构建</strong
            >
            还是其它阶段。
          </p>
          <div class="meta-list">
            <div class="meta-card">
              <div class="label">已解析文件</div>
              <div class="value" id="fileCount">0</div>
            </div>
            <div class="meta-card">
              <div class="label">有效事件</div>
              <div class="value" id="eventCount">0</div>
            </div>
            <div class="meta-card">
              <div class="label">运行次数</div>
              <div class="value" id="runCount">0</div>
            </div>
            <div class="meta-card">
              <div class="label">解析错误行</div>
              <div class="value" id="errorCount">0</div>
            </div>
          </div>
        </div>
        <div class="drop-zone" id="dropZone">
          <div style="text-align: center">
            <svg
              width="48"
              height="48"
              viewBox="0 0 24 24"
              fill="none"
              stroke="rgba(126,240,196,0.6)"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              style="margin-bottom: 8px"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="17 8 12 3 7 8" />
              <line x1="12" y1="3" x2="12" y2="15" />
            </svg>
            <div class="drop-title">拖拽日志文件到这里</div>
          </div>
          <div class="helper" style="text-align: center">
            支持一次上传多个
            <code>.log</code> 文件；会自动忽略无法解析的行，并按
            <code>run_id</code> 合并。
          </div>
          <div class="actions" style="justify-content: center">
            <label class="button-like" for="fileInput">📂 选择日志文件</label>
            <button id="loadSampleBtn" type="button">💡 路径提示</button>
            <button id="clearBtn" type="button">🗑 清空</button>
          </div>
          <input
            id="fileInput"
            type="file"
            accept=".log,.jsonl,.txt"
            multiple
          />
          <div class="helper" id="dropHint" style="text-align: center">
            常见路径：<span class="mono">logs/agent_perf-YYYY-MM-DD.log</span>
          </div>
        </div>
      </section>

      <section class="layout">
        <aside class="panel">
          <h2 class="section-title">运行列表</h2>
          <div class="runs-header">
            <input
              id="runSearch"
              type="search"
              placeholder="搜索 run_id / ontology / session_id"
            />
          </div>
          <div class="runs-header">
            <select id="sortSelect">
              <option value="latest">按最新时间</option>
              <option value="slowest">按总耗时</option>
              <option value="llm">按 LLM 耗时</option>
              <option value="tools">按工具耗时</option>
            </select>
          </div>
          <div class="run-list" id="runList">
            <div class="empty">
              <svg
                width="48"
                height="48"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1"
                stroke-linecap="round"
                stroke-linejoin="round"
                style="opacity: 0.4; margin-bottom: 8px"
              >
                <path
                  d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                />
                <polyline points="14 2 14 8 20 8" />
              </svg>
              <div>先上传性能日志文件</div>
            </div>
          </div>
        </aside>

        <main class="grid" id="detailRoot">
          <section class="panel">
            <h2 class="section-title icon-title">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="var(--accent)"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="10" />
                <polyline points="12 6 12 12 16 14" />
              </svg>
              运行概览
            </h2>
            <div class="empty">
              <svg
                width="64"
                height="64"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1"
                stroke-linecap="round"
                stroke-linejoin="round"
                style="opacity: 0.35"
              >
                <path
                  d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                />
                <polyline points="14 2 14 8 20 8" />
                <line x1="16" y1="13" x2="8" y2="13" />
                <line x1="16" y1="17" x2="8" y2="17" />
              </svg>
              <div>上传日志文件后，在左侧选择运行记录查看详细分析。</div>
            </div>
          </section>
        </main>
      </section>
    </div>

    <script>
      const state = {
        files: [],
        parseErrors: [],
        events: [],
        runs: [],
        selectedRunId: null,
      };

      const els = {
        fileInput: document.getElementById('fileInput'),
        dropZone: document.getElementById('dropZone'),
        runList: document.getElementById('runList'),
        detailRoot: document.getElementById('detailRoot'),
        runSearch: document.getElementById('runSearch'),
        sortSelect: document.getElementById('sortSelect'),
        fileCount: document.getElementById('fileCount'),
        eventCount: document.getElementById('eventCount'),
        runCount: document.getElementById('runCount'),
        errorCount: document.getElementById('errorCount'),
        clearBtn: document.getElementById('clearBtn'),
        loadSampleBtn: document.getElementById('loadSampleBtn'),
        dropHint: document.getElementById('dropHint'),
      };

      function escapeHtml(value) {
        return String(value ?? '')
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#39;');
      }

      function formatMs(ms) {
        const n = Number(ms || 0);
        if (!Number.isFinite(n)) return '-';
        if (n < 1000) return `${n.toFixed(0)} ms`;
        if (n < 60000) return `${(n / 1000).toFixed(2)} s`;
        const min = Math.floor(n / 60000);
        const sec = ((n % 60000) / 1000).toFixed(1);
        return `${min}m ${sec}s`;
      }

      function formatPct(part, total) {
        if (!total) return '0%';
        return `${((part / total) * 100).toFixed(1)}%`;
      }

      const STATUS_META = {
        continue: {
          label: '继续下一轮',
          detail:
            '这一轮已经拿到了中间结果，但还没有产出最终答案；系统会把本轮结果带入下一轮继续推理。',
          tone: 'progress',
        },
        final_output: {
          label: '产出最终答案',
          detail: '这一轮没有再继续调用工具，模型已经直接给出最终结果。',
          tone: 'success',
        },
        terminal_tool_batch: {
          label: '工具直接结束',
          detail: '工具批本身已经返回终态结果，因此这一轮不会再进入下一轮。',
          tone: 'success',
        },
        terminal: {
          label: '运行结束',
          detail: '整次运行已经结束。',
          tone: 'success',
        },
        success: {
          label: '成功',
          detail: '整次运行成功完成。',
          tone: 'success',
        },
        cancelled: {
          label: '已取消',
          detail: '运行在完成前被取消。',
          tone: 'warn',
        },
        error: {
          label: '失败',
          detail: '运行过程中发生错误。',
          tone: 'danger',
        },
        http_error: {
          label: '请求失败',
          detail: '与模型或外部服务通信时发生 HTTP 错误。',
          tone: 'danger',
        },
        iteration_limit_exceeded: {
          label: '超过轮次上限',
          detail: '达到最大迭代轮数后仍未结束，因此被强制停止。',
          tone: 'warn',
        },
        unknown: {
          label: '未知状态',
          detail: '日志中没有记录明确状态。',
          tone: 'neutral',
        },
      };

      function getStatusMeta(status) {
        const rawStatus = String(status ?? '').trim();
        if (!rawStatus) return { code: 'unknown', ...STATUS_META.unknown };
        const meta = STATUS_META[rawStatus];
        if (meta) return { code: rawStatus, ...meta };
        return {
          code: rawStatus,
          label: rawStatus,
          detail: `未配置解释文案的原始状态：${rawStatus}`,
          tone: 'neutral',
        };
      }

      function renderStatusTag(status) {
        const meta = getStatusMeta(status);
        const title = `${meta.detail}（原始值：${meta.code}）`;
        return `<span class="tag tag--${escapeHtml(meta.tone)}" title="${escapeHtml(title)}">${escapeHtml(meta.label)}</span>`;
      }

      function renderStatusLegend(statuses) {
        const uniqueStatuses = [
          ...new Set(
            statuses
              .map((status) => String(status ?? '').trim())
              .filter(Boolean),
          ),
        ];
        if (!uniqueStatuses.length) return '';
        return `
          <div class="status-note">
            <div class="label">状态说明</div>
            <div class="helper">
              页面默认展示的是用户可读文案，不再直接暴露内部枚举值；需要排障时可以看每个状态卡片里的原始值。
            </div>
            <div class="status-grid">
              ${uniqueStatuses
                .map((status) => {
                  const meta = getStatusMeta(status);
                  return `
                  <div class="status-card">
                    <div>${renderStatusTag(status)}</div>
                    <div class="helper">${escapeHtml(meta.detail)}</div>
                    <div class="helper">原始值：<span class="mono">${escapeHtml(meta.code)}</span></div>
                  </div>
                `;
                })
                .join('')}
            </div>
          </div>
        `;
      }

      /* === Count-up animation === */
      function countUp(el, target, duration = 600) {
        const start = parseInt(el.textContent) || 0;
        if (start === target) return;
        const startTime = performance.now();
        function tick(now) {
          const progress = Math.min((now - startTime) / duration, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          el.textContent = String(Math.round(start + (target - start) * eased));
          if (progress < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      }

      /* === Heat-map class for duration cell === */
      function heatClass(ms, warnThreshold = 3000, hotThreshold = 8000) {
        if (ms >= hotThreshold) return 'heat-hot';
        if (ms >= warnThreshold) return 'heat-warm';
        return '';
      }

      /* === Empty state with SVG illustration === */
      function emptyState(text) {
        return `<div class="empty">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
          <div>${text}</div>
        </div>`;
      }

      function safeJsonParse(line) {
        try {
          return JSON.parse(line);
        } catch (error) {
          return null;
        }
      }

      function normalizeTimestamp(raw, fallbackIndex) {
        if (!raw) return { ms: fallbackIndex, text: '-' };
        const normalized = String(raw).replace(' ', 'T');
        const date = new Date(normalized);
        if (Number.isNaN(date.getTime())) {
          return { ms: fallbackIndex, text: String(raw) };
        }
        return { ms: date.getTime(), text: String(raw) };
      }

      function getRunSortValue(run, mode) {
        if (mode === 'slowest') return run.totalMs;
        if (mode === 'llm') return run.llmMs;
        if (mode === 'tools') return run.toolsBatchMs;
        return run.lastTs;
      }

      function parseFiles(files) {
        const allEvents = [];
        const parseErrors = [];
        const fileNames = [];
        let globalIndex = 0;

        return Promise.all(
          Array.from(files).map(async (file) => {
            fileNames.push(file.name);
            const text = await file.text();
            const lines = text.split(/\r?\n/);
            lines.forEach((line, lineIndex) => {
              if (!line.trim()) return;
              const parsed = safeJsonParse(line);
              if (!parsed || typeof parsed !== 'object') {
                parseErrors.push({
                  file: file.name,
                  line: lineIndex + 1,
                  text: line.slice(0, 200),
                });
                return;
              }
              globalIndex += 1;
              allEvents.push({
                ...parsed,
                __file: file.name,
                __line: lineIndex + 1,
                __index: globalIndex,
              });
            });
          }),
        ).then(() => ({ allEvents, parseErrors, fileNames }));
      }

      function buildRuns(events) {
        const byRun = new Map();

        events.forEach((event) => {
          const runId = String(event.run_id || '').trim();
          if (!runId) return;
          if (!byRun.has(runId)) byRun.set(runId, []);
          byRun.get(runId).push(event);
        });

        const runs = [];
        byRun.forEach((runEvents, runId) => {
          runEvents.sort((a, b) => {
            const ta = normalizeTimestamp(a.timestamp, a.__index).ms;
            const tb = normalizeTimestamp(b.timestamp, b.__index).ms;
            return ta - tb || a.__index - b.__index;
          });

          const firstEvent = runEvents[0] || {};
          const lastEvent = runEvents[runEvents.length - 1] || {};
          const firstTs = normalizeTimestamp(
            firstEvent.timestamp,
            firstEvent.__index || 0,
          ).ms;
          const lastTs = normalizeTimestamp(
            lastEvent.timestamp,
            lastEvent.__index || 0,
          ).ms;

          const getEvent = (name) =>
            runEvents.find((item) => item.event === name);
          const getLastEvent = (name) =>
            [...runEvents].reverse().find((item) => item.event === name);
          const sumEventDuration = (name) =>
            runEvents
              .filter((item) => item.event === name)
              .reduce((sum, item) => sum + Number(item.duration_ms || 0), 0);

          const orchestratorCompleted = getLastEvent(
            'main_agent.orchestrator.completed',
          );
          const runCompleted = getLastEvent('main_agent.run.completed');
          const workerCompleted = getLastEvent('main_agent.worker.completed');
          const totalMs = Number(
            orchestratorCompleted?.total_duration_ms ??
              orchestratorCompleted?.duration_ms ??
              runCompleted?.total_duration_ms ??
              workerCompleted?.duration_ms ??
              Math.max(0, lastTs - firstTs),
          );

          const rawLlmMs = sumEventDuration('main_agent.llm.completed');
          const toolsBatchMs = sumEventDuration(
            'main_agent.tools.batch.completed',
          );
          const promptBuildMs = runEvents
            .filter((item) => item.event === 'main_agent.iteration.prepared')
            .reduce((sum, item) => sum + Number(item.prompt_build_ms || 0), 0);

          const iterationMap = new Map();
          runEvents.forEach((item) => {
            const iteration = Number(item.iteration);
            if (!Number.isFinite(iteration) || iteration <= 0) return;
            if (!iterationMap.has(iteration)) {
              iterationMap.set(iteration, {
                iteration,
                status: '-',
                llmMs: 0,
                toolsBatchMs: 0,
                iterTotalMs: 0,
                promptBuildMs: 0,
                llmInputChars: 0,
                llmMessageCount: 0,
                responseHeadersMs: 0,
                collectMs: 0,
                firstContentMs: null,
                firstToolCallMs: null,
                firstReasoningMs: null,
                toolCallsCount: 0,
                assistantContentChars: 0,
                toolNames: [],
              });
            }
            const row = iterationMap.get(iteration);
            if (item.event === 'main_agent.iteration.prepared') {
              row.promptBuildMs = Number(item.prompt_build_ms || 0);
              row.llmInputChars = Number(item.llm_input_chars || 0);
              row.llmMessageCount = Number(item.llm_message_count || 0);
            } else if (item.event === 'main_agent.llm.completed') {
              row.llmRawMs = Number(item.duration_ms || 0);
              row.llmMs = row.llmRawMs;
              row.toolCallsCount = Number(item.tool_calls_count || 0);
              row.assistantContentChars = Number(
                item.assistant_content_chars || 0,
              );
              row.toolNames = Array.isArray(item.tool_names)
                ? item.tool_names
                : [];
            } else if (item.event === 'main_agent.tools.batch.completed') {
              row.toolsBatchMs = Number(item.duration_ms || 0);
            } else if (item.event === 'main_agent.iteration.completed') {
              row.iterTotalMs = Number(item.duration_ms || 0);
              row.status = item.status || '-';
            } else if (
              item.event === 'llm.request.completed' &&
              item.request_label === 'main_agent_iteration' &&
              item.status === 'success'
            ) {
              row.responseHeadersMs = Number(item.response_headers_ms || 0);
            } else if (
              item.event === 'llm.collect.completed' &&
              item.request_label === 'main_agent_iteration'
            ) {
              row.collectMs = Number(item.duration_ms || 0);
              row.firstContentMs = item.first_content_ms ?? null;
              row.firstToolCallMs = item.first_tool_call_ms ?? null;
              row.firstReasoningMs = item.first_reasoning_ms ?? null;
            }
          });

          const normalizedIterations = Array.from(iterationMap.values()).map(
            (row) => {
              if (row.iterTotalMs > 0) {
                const overlapMs = Math.max(
                  0,
                  row.promptBuildMs +
                    row.llmRawMs +
                    row.toolsBatchMs -
                    row.iterTotalMs,
                );
                return {
                  ...row,
                  overlapMs,
                  llmMs: Math.max(0, row.llmRawMs - overlapMs),
                };
              }
              return {
                ...row,
                overlapMs: 0,
                llmMs: row.llmRawMs,
              };
            },
          );

          const llmMs =
            normalizedIterations.length > 0
              ? normalizedIterations.reduce(
                  (sum, row) => sum + Number(row.llmMs || 0),
                  0,
                )
              : rawLlmMs;
          const otherMs = Math.max(
            0,
            totalMs - llmMs - toolsBatchMs - promptBuildMs,
          );

          const toolSummaryMap = new Map();
          runEvents
            .filter((item) => item.event === 'main_agent.tool.completed')
            .forEach((item) => {
              const toolName = String(item.tool_name || 'unknown');
              if (!toolSummaryMap.has(toolName)) {
                toolSummaryMap.set(toolName, {
                  name: toolName,
                  count: 0,
                  totalMs: 0,
                  maxMs: 0,
                  statuses: new Set(),
                });
              }
              const row = toolSummaryMap.get(toolName);
              const duration = Number(item.duration_ms || 0);
              row.count += 1;
              row.totalMs += duration;
              row.maxMs = Math.max(row.maxMs, duration);
              if (item.status) row.statuses.add(String(item.status));
            });

          const selectedOntologyId =
            getEvent('main_agent.orchestrator.enter')?.selected_ontology_id ||
            getEvent('main_agent.run.start')?.selected_ontology_id ||
            '-';
          const status =
            orchestratorCompleted?.status ||
            runCompleted?.status ||
            workerCompleted?.status ||
            'unknown';

          runs.push({
            runId,
            sessionId: firstEvent.session_id || '-',
            turnId: firstEvent.turn_id ?? '-',
            selectedOntologyId,
            status,
            firstTimestamp: firstEvent.timestamp || '-',
            lastTimestamp: lastEvent.timestamp || '-',
            firstTs,
            lastTs,
            totalMs,
            llmMs,
            toolsBatchMs,
            promptBuildMs,
            otherMs,
            events: runEvents,
            iterations: normalizedIterations.sort(
              (a, b) => a.iteration - b.iteration,
            ),
            tools: Array.from(toolSummaryMap.values())
              .map((item) => ({ ...item, statuses: Array.from(item.statuses) }))
              .sort((a, b) => b.totalMs - a.totalMs),
          });
        });

        return runs.sort((a, b) => b.lastTs - a.lastTs);
      }

      function renderOverview() {
        countUp(els.fileCount, state.files.length);
        countUp(els.eventCount, state.events.length);
        countUp(els.runCount, state.runs.length);
        countUp(els.errorCount, state.parseErrors.length);
      }

      function renderRunList() {
        const keyword = els.runSearch.value.trim().toLowerCase();
        const sortMode = els.sortSelect.value;
        const runs = [...state.runs]
          .filter((run) => {
            if (!keyword) return true;
            const runStatusMeta = getStatusMeta(run.status);
            const haystack = [
              run.runId,
              run.sessionId,
              run.selectedOntologyId,
              run.status,
              runStatusMeta.label,
              runStatusMeta.detail,
            ]
              .join(' ')
              .toLowerCase();
            return haystack.includes(keyword);
          })
          .sort(
            (a, b) =>
              getRunSortValue(b, sortMode) - getRunSortValue(a, sortMode),
          );

        if (!runs.length) {
          els.runList.innerHTML = emptyState('没有匹配的运行记录。');
          return;
        }

        if (
          !state.selectedRunId ||
          !runs.some((run) => run.runId === state.selectedRunId)
        ) {
          state.selectedRunId = runs[0].runId;
        }

        els.runList.innerHTML = runs
          .map((run, i) => {
            const active = run.runId === state.selectedRunId ? ' active' : '';
            const total = Math.max(run.totalMs, 1);
            return `
            <div class="run-item${active}" data-run-id="${escapeHtml(run.runId)}" style="animation-delay:${i * 0.04}s">
              <div class="id mono">${escapeHtml(run.runId)}</div>
              <div class="summary">
                <div>总耗时：<strong>${formatMs(run.totalMs)}</strong> · ${run.iterations.length} 轮</div>
                <div>LLM：${formatMs(run.llmMs)} · 工具：${formatMs(run.toolsBatchMs)}</div>
                <div>Ontology：${escapeHtml(run.selectedOntologyId)}</div>
                <div>状态：${renderStatusTag(run.status)}</div>
              </div>
              <div class="mini-stack">
                <div class="llm" style="width:${(run.llmMs / total) * 100}%"></div>
                <div class="tools" style="width:${(run.toolsBatchMs / total) * 100}%"></div>
                <div class="prompt" style="width:${(run.promptBuildMs / total) * 100}%"></div>
                <div class="other" style="width:${(run.otherMs / total) * 100}%"></div>
              </div>
            </div>
          `;
          })
          .join('');

        els.runList.querySelectorAll('.run-item').forEach((node) => {
          node.addEventListener('click', () => {
            state.selectedRunId = node.dataset.runId;
            renderRunList();
            renderRunDetail();
          });
        });
      }

      function renderStack(run) {
        const total = Math.max(run.totalMs, 1);
        return `
          <div class="stack-bars">
            <div class="llm has-tip" style="width:${(run.llmMs / total) * 100}%">
              <span class="tip">LLM：${formatMs(run.llmMs)} (${formatPct(run.llmMs, total)})</span>
            </div>
            <div class="tools has-tip" style="width:${(run.toolsBatchMs / total) * 100}%">
              <span class="tip">工具批：${formatMs(run.toolsBatchMs)} (${formatPct(run.toolsBatchMs, total)})</span>
            </div>
            <div class="prompt has-tip" style="width:${(run.promptBuildMs / total) * 100}%">
              <span class="tip">Prompt：${formatMs(run.promptBuildMs)} (${formatPct(run.promptBuildMs, total)})</span>
            </div>
            <div class="other has-tip" style="width:${(run.otherMs / total) * 100}%">
              <span class="tip">其它：${formatMs(run.otherMs)} (${formatPct(run.otherMs, total)})</span>
            </div>
          </div>
          <div class="legend">
            <span><i class="dot llm"></i> LLM ${formatMs(run.llmMs)} (${formatPct(run.llmMs, total)})</span>
            <span><i class="dot tools"></i> 工具批 ${formatMs(run.toolsBatchMs)} (${formatPct(run.toolsBatchMs, total)})</span>
            <span><i class="dot prompt"></i> Prompt ${formatMs(run.promptBuildMs)} (${formatPct(run.promptBuildMs, total)})</span>
            <span><i class="dot other"></i> 其它 ${formatMs(run.otherMs)} (${formatPct(run.otherMs, total)})</span>
          </div>
        `;
      }

      function renderBars(
        items,
        valueKey,
        labelRenderer,
        valueRenderer = formatMs,
      ) {
        if (!items.length) return '<div class="empty">暂无数据</div>';
        const max = Math.max(
          ...items.map((item) => Number(item[valueKey] || 0)),
          1,
        );
        return `<div class="bar-list">${items
          .map((item) => {
            const value = Number(item[valueKey] || 0);
            return `
            <div class="bar-row">
              <div>${labelRenderer(item)}</div>
              <div class="bar-track"><div class="bar-fill" style="width:${(value / max) * 100}%"></div></div>
              <div>${valueRenderer(value, item)}</div>
            </div>
          `;
          })
          .join('')}</div>`;
      }

      function renderRunDetail() {
        const run = state.runs.find(
          (item) => item.runId === state.selectedRunId,
        );
        if (!run) {
          els.detailRoot.innerHTML = `<section class="panel">${emptyState('请选择一条运行记录。')}</section>`;
          return;
        }

        const statusLegend = renderStatusLegend([
          run.status,
          ...run.iterations.map((row) => row.status),
        ]);
        const iterationRows = run.iterations
          .map(
            (row) => `
          <tr>
            <td>${row.iteration}</td>
            <td>${renderStatusTag(row.status)}</td>
            <td class="${heatClass(row.iterTotalMs)}">${formatMs(row.iterTotalMs)}</td>
            <td class="${heatClass(row.llmMs)}">${formatMs(row.llmMs)}</td>
            <td>${formatMs(row.responseHeadersMs)}</td>
            <td>${formatMs(row.collectMs)}</td>
            <td class="${heatClass(row.toolsBatchMs, 2000, 6000)}">${formatMs(row.toolsBatchMs)}</td>
            <td>${formatMs(row.promptBuildMs)}</td>
            <td>${row.llmInputChars || '-'}</td>
            <td>${row.llmMessageCount || '-'}</td>
            <td>${row.toolCallsCount || 0}</td>
            <td class="mono">${escapeHtml((row.toolNames || []).join(', ') || '-')}</td>
            <td>${row.firstReasoningMs == null ? '-' : formatMs(row.firstReasoningMs)}</td>
            <td>${row.firstContentMs == null ? '-' : formatMs(row.firstContentMs)}</td>
            <td>${row.firstToolCallMs == null ? '-' : formatMs(row.firstToolCallMs)}</td>
          </tr>
        `,
          )
          .join('');

        /* Collect unique event types for filter pills */
        const eventTypes = [
          ...new Set(run.events.map((e) => e.event || '-')),
        ].sort();
        const filterPillsHtml = eventTypes
          .map(
            (t) =>
              `<button class="filter-pill" data-etype="${escapeHtml(t)}">${escapeHtml(t.replace('main_agent.', ''))}</button>`,
          )
          .join('');

        const eventRows = run.events
          .map(
            (event) => `
          <tr data-etype="${escapeHtml(event.event || '-')}">
            <td class="mono">${escapeHtml(event.timestamp || '-')}</td>
            <td class="mono">${escapeHtml(event.event || '-')}</td>
            <td>${event.iteration ?? '-'}</td>
            <td>${event.status ? renderStatusTag(event.status) : '-'}</td>
            <td class="${heatClass(Number(event.duration_ms || event.total_duration_ms || 0))}">${event.duration_ms != null ? formatMs(event.duration_ms) : event.total_duration_ms != null ? formatMs(event.total_duration_ms) : '-'}</td>
            <td class="mono">${escapeHtml(event.tool_name || (Array.isArray(event.tool_names) ? event.tool_names.join(', ') : '-'))}</td>
            <td class="mono">${escapeHtml(event.request_label || '-')}</td>
            <td class="mono">${escapeHtml(event.__file)}:${event.__line}</td>
          </tr>
        `,
          )
          .join('');

        const slowIterations = [...run.iterations]
          .sort((a, b) => b.iterTotalMs - a.iterTotalMs)
          .slice(0, 8);
        const llmIterations = [...run.iterations]
          .sort((a, b) => b.llmMs - a.llmMs)
          .slice(0, 8);

        els.detailRoot.innerHTML = `
          <section class="panel">
            <h2 class="section-title icon-title">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              运行概览
            </h2>
            <div class="grid four">
              <div class="stat-card">
                <div class="label">总耗时</div>
                <div class="num">${formatMs(run.totalMs)}</div>
                <div class="sub">${renderStatusTag(run.status)} · ${run.iterations.length} 轮</div>
              </div>
              <div class="stat-card">
                <div class="label">LLM（去重叠）</div>
                <div class="num">${formatMs(run.llmMs)}</div>
                <div class="sub">占比 ${formatPct(run.llmMs, run.totalMs)}</div>
              </div>
              <div class="stat-card">
                <div class="label">工具批执行</div>
                <div class="num">${formatMs(run.toolsBatchMs)}</div>
                <div class="sub">占比 ${formatPct(run.toolsBatchMs, run.totalMs)}</div>
              </div>
              <div class="stat-card">
                <div class="label">Prompt 构建</div>
                <div class="num">${formatMs(run.promptBuildMs)}</div>
                <div class="sub">其余 ${formatMs(run.otherMs)}</div>
              </div>
            </div>
            <div class="top-gap">${renderStack(run)}</div>
            <div class="grid three top-gap">
              <div class="stat-card">
                <div class="label">Run ID</div>
                <div class="sub mono">${escapeHtml(run.runId)}</div>
              </div>
              <div class="stat-card">
                <div class="label">Session / Turn</div>
                <div class="sub mono">${escapeHtml(run.sessionId)} / ${escapeHtml(run.turnId)}</div>
              </div>
              <div class="stat-card">
                <div class="label">Ontology</div>
                <div class="sub mono">${escapeHtml(run.selectedOntologyId)}</div>
              </div>
            </div>
            ${statusLegend}
          </section>

          <section class="grid two">
            <div class="panel">
              <h2 class="section-title icon-title collapse-header" data-target="slow-iter">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 17l5-5-5-5M6 17l5-5-5-5"/></svg>
                最慢轮次
              </h2>
              <div class="collapse-body" id="slow-iter">
              ${renderBars(
                slowIterations,
                'iterTotalMs',
                (row) =>
                  `第 <strong>${row.iteration}</strong> 轮 · ${renderStatusTag(row.status)}`,
                (value, row) =>
                  `${formatMs(value)} · LLM ${formatMs(row.llmMs)} / 工具 ${formatMs(row.toolsBatchMs)}`,
              )}
              </div>
            </div>
            <div class="panel">
              <h2 class="section-title icon-title collapse-header" data-target="llm-iter">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--warn)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 6v6l4 2"/></svg>
                LLM 最慢轮次
              </h2>
              <div class="collapse-body" id="llm-iter">
              ${renderBars(
                llmIterations,
                'llmMs',
                (row) =>
                  `第 <strong>${row.iteration}</strong> 轮 · ${row.toolCallsCount || 0} 次工具调用`,
                (value, row) =>
                  `${formatMs(value)} · headers ${formatMs(row.responseHeadersMs)} / collect ${formatMs(row.collectMs)}`,
              )}
              </div>
            </div>
          </section>

          <section class="grid two">
            <div class="panel">
              <h2 class="section-title icon-title collapse-header" data-target="tool-time">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                工具累计耗时
              </h2>
              <div class="collapse-body" id="tool-time">
              ${renderBars(
                run.tools.slice(0, 12),
                'totalMs',
                (tool) =>
                  `<span class="mono">${escapeHtml(tool.name)}</span> · ${tool.count} 次`,
                (value, tool) =>
                  `${formatMs(value)} · max ${formatMs(tool.maxMs)}`,
              )}
              </div>
            </div>
            <div class="panel">
              <h2 class="section-title icon-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                运行时间窗口
              </h2>
              <div class="grid two">
                <div class="stat-card">
                  <div class="label">开始时间</div>
                  <div class="sub mono">${escapeHtml(run.firstTimestamp)}</div>
                </div>
                <div class="stat-card">
                  <div class="label">结束时间</div>
                  <div class="sub mono">${escapeHtml(run.lastTimestamp)}</div>
                </div>
                <div class="stat-card">
                  <div class="label">事件数</div>
                  <div class="num">${run.events.length}</div>
                </div>
                <div class="stat-card">
                  <div class="label">工具种类数</div>
                  <div class="num">${run.tools.length}</div>
                </div>
              </div>
            </div>
          </section>

          <section class="panel">
            <h2 class="section-title icon-title collapse-header" data-target="iter-detail">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
              按轮次明细
            </h2>
            <div class="collapse-body" id="iter-detail">
            <div class="table-wrap" style="max-height:420px;">
              <table>
                <thead>
                  <tr>
                    <th>轮次</th><th>状态</th><th>总耗时</th><th>LLM(去重叠)</th><th>Headers</th><th>Collect</th><th>工具批</th><th>Prompt</th><th>输入字符</th><th>消息数</th><th>工具调用数</th><th>工具名</th><th>首个 reasoning</th><th>首个 content</th><th>首个 tool call</th>
                  </tr>
                </thead>
                <tbody>${iterationRows || '<tr><td colspan="15" class="empty">暂无轮次数据</td></tr>'}</tbody>
              </table>
            </div>
            </div>
          </section>

          <section class="panel">
            <h2 class="section-title icon-title collapse-header" data-target="event-tl">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
              事件时间线 <span class="muted" style="font-size:12px;font-weight:400;margin-left:6px;">${run.events.length} 条</span>
            </h2>
            <div class="collapse-body" id="event-tl">
            <div class="filter-bar" id="eventFilterBar">
              <button class="filter-pill active" data-etype="__all__">全部</button>
              ${filterPillsHtml}
            </div>
            <div class="table-wrap" style="max-height:500px;">
              <table>
                <thead>
                  <tr>
                    <th>时间</th><th>事件</th><th>轮次</th><th>状态</th><th>耗时</th><th>工具</th><th>请求标签</th><th>来源</th>
                  </tr>
                </thead>
                <tbody id="eventTableBody">${eventRows}</tbody>
              </table>
            </div>
            </div>
          </section>
        `;

        /* Wire collapse headers */
        els.detailRoot
          .querySelectorAll('.collapse-header')
          .forEach((header) => {
            header.addEventListener('click', () => {
              const targetId = header.dataset.target;
              const body = document.getElementById(targetId);
              if (!body) return;
              header.classList.toggle('collapsed');
              body.classList.toggle('hidden');
            });
          });

        /* Wire event filter pills */
        const filterBar = document.getElementById('eventFilterBar');
        const eventBody = document.getElementById('eventTableBody');
        if (filterBar && eventBody) {
          filterBar.addEventListener('click', (e) => {
            const pill = e.target.closest('.filter-pill');
            if (!pill) return;
            const { etype } = pill.dataset;
            filterBar
              .querySelectorAll('.filter-pill')
              .forEach((p) => p.classList.remove('active'));
            pill.classList.add('active');
            eventBody.querySelectorAll('tr').forEach((row) => {
              row.style.display =
                etype === '__all__' || row.dataset.etype === etype
                  ? ''
                  : 'none';
            });
          });
        }
      }

      function rerender() {
        renderOverview();
        renderRunList();
        renderRunDetail();
      }

      async function loadFiles(files) {
        if (!files || !files.length) return;
        const { allEvents, parseErrors, fileNames } = await parseFiles(files);
        state.files = fileNames;
        state.parseErrors = parseErrors;
        state.events = allEvents;
        state.runs = buildRuns(allEvents);
        state.selectedRunId = state.runs[0]?.runId || null;
        rerender();
      }

      function clearState() {
        state.files = [];
        state.parseErrors = [];
        state.events = [];
        state.runs = [];
        state.selectedRunId = null;
        els.fileInput.value = '';
        rerender();
      }

      els.fileInput.addEventListener('change', (event) => {
        loadFiles(event.target.files);
      });

      ['dragenter', 'dragover'].forEach((eventName) => {
        els.dropZone.addEventListener(eventName, (event) => {
          event.preventDefault();
          els.dropZone.classList.add('dragover');
        });
      });

      ['dragleave', 'drop'].forEach((eventName) => {
        els.dropZone.addEventListener(eventName, (event) => {
          event.preventDefault();
          if (eventName === 'drop') {
            loadFiles(event.dataTransfer.files);
          }
          els.dropZone.classList.remove('dragover');
        });
      });

      els.clearBtn.addEventListener('click', clearState);
      els.runSearch.addEventListener('input', renderRunList);
      els.sortSelect.addEventListener('change', renderRunList);
      els.loadSampleBtn.addEventListener('click', () => {
        els.dropHint.innerHTML =
          '本页不会主动读取本地路径。请把 <span class="mono">logs/agent_perf-YYYY-MM-DD.log</span> 拖进来，或用“选择日志文件”上传。';
      });

      rerender();
    </script>
  </body>
</html>
