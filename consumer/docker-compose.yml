version: '3.3'

# Full-stack deployment: both backend and frontend
# For standalone deployment, use backend/docker-compose.yml or frontend/docker-compose.yml

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: onto-agent-backend:${TAG:-latest}
    container_name: onto-agent-backend-${TAG:-latest}
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5055}:5055"
    volumes:
      - ./backend/config:/app/config:ro
      - ./backend/logs:/app/logs
      - ./.onto-runtime:/app/.onto-runtime
    env_file:
      - ./backend/.env
    environment:
      - FLASK_APP=run.py
      - PYTHONUNBUFFERED=1
      - PROJECT_ROOT=/app/.onto-runtime
    networks:
      - onto-agent-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5055/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: onto-agent-frontend:${TAG:-latest}
    container_name: onto-agent-frontend-${TAG:-latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8888}:80"
    volumes:
      - ./frontend/logs/nginx:/var/log/nginx
    depends_on:
      - backend
    environment:
      - NGINX_BACKEND_UPSTREAM=${NGINX_BACKEND_UPSTREAM:-http://backend:5055}
      - NGINX_TYPEDB_UPSTREAM=${NGINX_TYPEDB_UPSTREAM:-http://backend:9991}
    networks:
      - onto-agent-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 5

  # 独立鉴权服务（opt-in）：docker compose --profile auth up 时启用。
  # 启用同时需在 backend/.env 设置 AUTH_MODE=remote、AUTH_SERVER_URL=http://auth-server:5056、
  # AUTH_SERVER_ADMIN_TOKEN=<与下方一致>。不发布宿主端口，仅 backend 经内网访问（ADR D4）。
  auth-server:
    build:
      context: ../auth-server
      dockerfile: Dockerfile
    image: onto-agent-auth-server:${TAG:-latest}
    container_name: onto-agent-auth-server-${TAG:-latest}
    restart: unless-stopped
    profiles:
      - auth
    volumes:
      - ./.onto-auth:/data
    environment:
      - AUTH_SERVER_HOST=0.0.0.0
      - AUTH_SERVER_DATA_DIR=/data
      - AUTH_SERVER_ISSUER=${AUTH_SERVER_ISSUER:-http://auth-server:5056}
      - AUTH_SERVER_ADMIN_TOKEN=${AUTH_SERVER_ADMIN_TOKEN:-}
      - AUTH_ENABLE_REGISTRATION=${AUTH_ENABLE_REGISTRATION:-false}
      - AUTH_MAIL_MODE=${AUTH_MAIL_MODE:-console}
      - AUTH_SMTP_HOST=${AUTH_SMTP_HOST:-}
      - AUTH_SMTP_PORT=${AUTH_SMTP_PORT:-587}
      - AUTH_SMTP_USERNAME=${AUTH_SMTP_USERNAME:-}
      - AUTH_SMTP_PASSWORD=${AUTH_SMTP_PASSWORD:-}
      - AUTH_SMTP_USE_TLS=${AUTH_SMTP_USE_TLS:-true}
      - AUTH_MAIL_FROM=${AUTH_MAIL_FROM:-}
    networks:
      - onto-agent-network

networks:
  onto-agent-network:
    driver: bridge
