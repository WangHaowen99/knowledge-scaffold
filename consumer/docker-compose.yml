# Full-stack deployment: both backend and frontend
# For standalone deployment, use backend/docker-compose.yml or frontend/docker-compose.yml

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: onto-agent-backend:${TAG:-latest}
    container_name: onto-agent-backend-${TAG:-latest}
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5055}:5055"
    volumes:
      - ./backend/config:/app/config:ro
      - ./backend/logs:/app/logs
      - ./.onto-runtime:/app/.onto-runtime
    env_file:
      - ./backend/.env
    environment:
      - FLASK_APP=run.py
      - PYTHONUNBUFFERED=1
      - PROJECT_ROOT=/app/.onto-runtime
      - MCP_SERVER_HOST=mcp
      - MCP_SERVER_PORT=7488
    depends_on:
      auth-server:
        condition: service_healthy
    networks:
      - onto-agent-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5055/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mcp:
    image: onto-agent-backend:${TAG:-latest}
    container_name: onto-agent-mcp-${TAG:-latest}
    restart: unless-stopped
    command: ["python", "-m", "api.protocols.mcp.server"]
    ports:
      - "${MCP_SERVER_PORT:-7488}:7488"
    volumes:
      - ./backend/config:/app/config:ro
      - ./backend/logs:/app/logs
      - ./.onto-runtime:/app/.onto-runtime
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - PROJECT_ROOT=/app/.onto-runtime
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=7488
      - MCP_TRANSPORT=both
      - MCP_AGENTIC_BASE_URL=http://backend:5055
    depends_on:
      - backend
    networks:
      - onto-agent-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:7488/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: onto-agent-frontend:${TAG:-latest}
    container_name: onto-agent-frontend-${TAG:-latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8888}:80"
    volumes:
      - ./frontend/logs/nginx:/var/log/nginx
    depends_on:
      - backend
      - mcp
    environment:
      - NGINX_BACKEND_UPSTREAM=${NGINX_BACKEND_UPSTREAM:-http://backend:5055}
      - NGINX_TYPEDB_UPSTREAM=${NGINX_TYPEDB_UPSTREAM:-http://backend:9991}
    networks:
      - onto-agent-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 5

  # 独立鉴权服务（必备组件）：remote 是唯一鉴权路径，backend 依赖其健康后启动。
  # 需在 backend/.env 设置 AUTH_SERVER_URL=http://auth-server:5056、
  # AUTH_SERVER_ADMIN_TOKEN=<与下方一致>。不发布宿主端口，仅 backend 经内网访问（ADR D4）。
  auth-server:
    build:
      context: ../auth-server
      dockerfile: Dockerfile
    image: onto-agent-auth-server:${TAG:-latest}
    container_name: onto-agent-auth-server-${TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./.onto-auth:/data
    environment:
      - AUTH_SERVER_HOST=0.0.0.0
      - AUTH_SERVER_DATA_DIR=/data
      - AUTH_SERVER_ISSUER=${AUTH_SERVER_ISSUER:-http://auth-server:5056}
      - AUTH_USER_MAX_COUNT=${AUTH_USER_MAX_COUNT:-1000}
      - AUTH_ENABLE_REGISTRATION=${AUTH_ENABLE_REGISTRATION:-false}
    networks:
      - onto-agent-network

networks:
  onto-agent-network:
    driver: bridge
