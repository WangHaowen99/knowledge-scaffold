services:
  backend:
    image: ${BACKEND_IMAGE}
    container_name: onto-agent-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5055}:5055"
    volumes:
      - ./.onto-runtime:/app/.onto-runtime
      - onto-jiuwenbox-sock:/run/jiuwenbox:ro
      - onto-jiuwenbox-runtime:/run/onto-runtime-attestation:ro
      - onto-deterministic-artifacts:/run/onto-deterministic-artifacts
    env_file:
      - ./backend/.env
    environment:
      - FLASK_APP=run.py
      - PYTHONUNBUFFERED=1
      - PROJECT_ROOT=/app/.onto-runtime
      - DETERMINISTIC_ARTIFACT_STAGING_ROOT=/run/onto-deterministic-artifacts
      - CHAT_STORAGE_DIR=/app/.onto-runtime/data/chats
      - EXECUTION_STORAGE_DIR=/app/.onto-runtime/data/executions
      - MCP_SERVER_HOST=mcp
      - MCP_SERVER_PORT=7488
      - AUTH_SERVER_URL=${AUTH_SERVER_URL:-http://auth-server:5056}
    depends_on:
      auth-server:
        condition: service_healthy
      jiuwenbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5055/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  jiuwenbox:
    image: ${JIUWENBOX_IMAGE}
    container_name: onto-agent-jiuwenbox
    restart: unless-stopped
    expose:
      - "8322"
    environment:
      - JIUWENBOX_LISTEN=unix:///run/jiuwenbox/jiuwenbox.sock
      - JIUWENBOX_UDS_MODE=0666
      - JIUWENBOX_POLICY_PATH=/app/jiuwenbox-policy.yaml
    volumes:
      - ./.onto-runtime:/app/.onto-runtime:ro
      - onto-jiuwenbox-sock:/run/jiuwenbox
      - onto-jiuwenbox-runtime:/run/onto-runtime-attestation
      - onto-deterministic-artifacts:/run/onto-deterministic-artifacts
      - ./deploy/jiuwenbox-policy.yaml:/app/jiuwenbox-policy.yaml:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    cgroup: host
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    sysctls:
      net.ipv4.ip_forward: "1"
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket,http.client;s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM);s.connect('/run/jiuwenbox/jiuwenbox.sock');c=http.client.HTTPConnection('localhost');c.sock=s;c.request('GET','/health');r=c.getresponse();exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3

  mcp:
    image: ${BACKEND_IMAGE}
    container_name: onto-agent-mcp
    restart: unless-stopped
    command: ["python", "-m", "api.protocols.mcp.server"]
    ports:
      - "${MCP_SERVER_PORT:-7488}:7488"
    volumes:
      - ./.onto-runtime:/app/.onto-runtime
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - PROJECT_ROOT=/app/.onto-runtime
      - CHAT_STORAGE_DIR=/app/.onto-runtime/data/chats
      - EXECUTION_STORAGE_DIR=/app/.onto-runtime/data/executions
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=7488
      - MCP_TRANSPORT=both
      - MCP_AGENTIC_BASE_URL=http://backend:5055
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:7488/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: onto-agent-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8888}:80"
    volumes:
      - ./frontend/logs/nginx:/var/log/nginx
    environment:
      - NGINX_BACKEND_UPSTREAM=${NGINX_BACKEND_UPSTREAM:-http://backend:5055}
      - NGINX_TYPEDB_UPSTREAM=${NGINX_TYPEDB_UPSTREAM:-http://backend:9991}
    depends_on:
      - backend
      - mcp
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 5

  # 独立鉴权服务（必备组件）：remote 是唯一鉴权路径，backend 依赖其健康后启动。
  # 不发布宿主端口，仅 backend 经容器网络访问 http://auth-server:5056；
  # 健康检查由镜像自带 HEALTHCHECK 提供。AUTH_SERVER_IMAGE 未设置时回退 latest。
  auth-server:
    image: ${AUTH_SERVER_IMAGE:-onto-agent-auth-server:latest}
    container_name: onto-agent-auth-server
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./.onto-auth:/data
    environment:
      - AUTH_SERVER_HOST=0.0.0.0
      - AUTH_SERVER_DATA_DIR=/data
      - AUTH_SERVER_ISSUER=${AUTH_SERVER_ISSUER:-http://auth-server:5056}
      - AUTH_ENABLE_REGISTRATION=${AUTH_ENABLE_REGISTRATION:-true}

volumes:
  onto-deterministic-artifacts:
  onto-jiuwenbox-sock:
  onto-jiuwenbox-runtime:
