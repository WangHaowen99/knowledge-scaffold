# NL2SQL 服务 + 评测 MySQL，独立于 deploy/ 的整栈构建和部署。一键部署用 ./deploy.sh，说明见 README.md。
# 宿主端口默认只绑 127.0.0.1；consumer 容器要访问时，在 .env 设置 NL2SQL_EXTERNAL_NETWORK，
# deploy.sh 会生成 docker-compose.override.yml，只把 nl2sql-service 接入该网络，MySQL 不加入。
services:
  nl2sql-service:
    build: .
    image: nl2sql-service:${NL2SQL_TAG:-latest}
    container_name: nl2sql-service
    restart: unless-stopped
    ports:
      - "${NL2SQL_BIND_ADDRESS:-127.0.0.1}:${NL2SQL_PORT:-5600}:5600"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NL2SQL_HOST=0.0.0.0
      - NL2SQL_PORT=5600
      - NL2SQL_TOKEN=${NL2SQL_TOKEN:?NL2SQL_TOKEN is required}
      - NL2SQL_DEFAULT_SCENE=${NL2SQL_DEFAULT_SCENE:-default}
      # 查询用只读账号，由 deploy.sh 在 MySQL 就绪后创建；密码直接拼进连接串，只能含字母和数字
      - EVAL_DB_URL=mysql://nl2sql_reader:${NL2SQL_DB_PASSWORD:?NL2SQL_DB_PASSWORD is required}@nl2sql-mysql:3306
      - MODELING_LLM_BASE_URL=${MODELING_LLM_BASE_URL:?MODELING_LLM_BASE_URL is required}
      - MODELING_LLM_MODEL=${MODELING_LLM_MODEL:?MODELING_LLM_MODEL is required}
      - MODELING_LLM_API_KEY=${MODELING_LLM_API_KEY:-}
    depends_on:
      nl2sql-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5600/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

  nl2sql-mysql:
    image: mysql:8
    container_name: nl2sql-mysql
    restart: unless-stopped
    # 只读账号对全部库授 SELECT 后收回系统库权限，需要开启部分撤销
    command: ["--partial-revokes=ON"]
    environment:
      # 只在数据卷首次初始化时生效；之后改 .env 不会改库里的密码
      - MYSQL_ROOT_PASSWORD=${EVAL_MYSQL_ROOT_PASSWORD:?EVAL_MYSQL_ROOT_PASSWORD is required}
    ports:
      - "${EVAL_MYSQL_BIND_ADDRESS:-127.0.0.1}:${EVAL_MYSQL_PORT:-3306}:3306"
    volumes:
      - nl2sql-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  nl2sql-mysql-data:
