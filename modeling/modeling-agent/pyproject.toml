[project]
name = "modeling-agent"
version = "0.1.0"
description = "openJiuwen runtime for the modeling workbench"
requires-python = ">=3.11,<3.14"
dependencies = [
  "aiosqlite>=0.20,<1",
  "httpx>=0.27,<1",
  "mcp>=1.26,<2",
  "openjiuwen==0.1.16.post5",
  "opentelemetry-sdk>=1.30,<2",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "starlette>=0.37,<1",
  "uvicorn>=0.30,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["modeling_agent*"]
exclude = ["skills*", "tests*"]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "strict"
