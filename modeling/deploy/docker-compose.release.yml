services:
  modeling:
    image: ${MODELING_IMAGE}
    container_name: mw-modeling
    restart: unless-stopped
    ports:
      - "${MODELING_PORT:-8100}:5100"
      - "${MODELING_MCP_PORT:-5188}:5188"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=5100
      - DATA_DIR=/data
      - MODELING_LLM_BASE_URL=${MODELING_LLM_BASE_URL:-}
      - MODELING_LLM_MODEL=${MODELING_LLM_MODEL:-}
      - MODELING_LLM_API_KEY=${MODELING_LLM_API_KEY:-}
      - MODELING_LLM_MAX_TOKENS=${MODELING_LLM_MAX_TOKENS:-128000}
      - MODELING_LLM_CONTEXT_WINDOW=${MODELING_LLM_CONTEXT_WINDOW:-1000000}
      - MODELING_TASK_LLM_BASE_URL=${MODELING_TASK_LLM_BASE_URL:-}
      - MODELING_TASK_LLM_MODEL=${MODELING_TASK_LLM_MODEL:-}
      - MODELING_TASK_LLM_API_KEY=${MODELING_TASK_LLM_API_KEY:-}
      - MODELING_LLM_CONFIG_ENCRYPTION_KEY=${MODELING_LLM_CONFIG_ENCRYPTION_KEY:-}
      - MODELING_SERVICE_TOKEN=${MODELING_SERVICE_TOKEN:-}
      - MODELING_MCP_HOST=0.0.0.0
      - MODELING_MCP_PORT=5188
      - MODELING_MCP_PUBLIC_BASE_URL=${MODELING_MCP_PUBLIC_BASE_URL:-http://localhost:5188}
      - MODELING_MCP_TOKEN_SECRET=${MODELING_MCP_TOKEN_SECRET:-}
      - MODELING_MCP_TRANSPORT=${MODELING_MCP_TRANSPORT:-both}
      - MODELING_MCP_ALLOWED_ORIGINS=${MODELING_MCP_ALLOWED_ORIGINS:-http://localhost:8100,http://127.0.0.1:8100}
      - MODELING_MCP_OPERATION_RULE_ENABLED=${MODELING_MCP_OPERATION_RULE_ENABLED:-false}
      - MODELING_ACCEPTANCE_MODE=${MODELING_ACCEPTANCE_MODE:-false}
      - MODELING_MCP_MAX_SSE_SESSIONS=${MODELING_MCP_MAX_SSE_SESSIONS:-10000}
      - MODELING_MCP_MAX_SSE_SESSIONS_PER_TOKEN=${MODELING_MCP_MAX_SSE_SESSIONS_PER_TOKEN:-20}
      - MODELING_MCP_MAX_SSE_SESSIONS_PER_PROJECT=${MODELING_MCP_MAX_SSE_SESSIONS_PER_PROJECT:-200}
      - MODELING_MCP_MAX_SSE_SESSIONS_PER_USER=${MODELING_MCP_MAX_SSE_SESSIONS_PER_USER:-100}
      - MODELING_MCP_MAX_SSE_SESSIONS_PER_IP=${MODELING_MCP_MAX_SSE_SESSIONS_PER_IP:-100}
      - MODELING_MCP_SSE_MAX_LIFETIME_SECONDS=${MODELING_MCP_SSE_MAX_LIFETIME_SECONDS:-28800}
      - MODELING_MCP_SSE_IDLE_TIMEOUT_SECONDS=${MODELING_MCP_SSE_IDLE_TIMEOUT_SECONDS:-1800}
      - AUTH_ISSUER_URL=${AUTH_ISSUER_URL:-http://auth-server:5056}
      - AUTH_JWT_ISSUER=${AUTH_JWT_ISSUER:-http://auth-server:5056}
      - AUTH_JWT_AUDIENCE=${AUTH_JWT_AUDIENCE:-meta-wise}
      - CONSUMER_API_URL=${CONSUMER_API_URL:-http://backend:5055}
      - MODELING_AGENT_BASE_URL=http://modeling-agent:5110
      - JIUWENBOX_SOCKET_PATH=/run/jiuwenbox/jiuwenbox.sock
      - EVAL_DB_URL=${EVAL_DB_URL:-}
      - MODELING_EVAL_BINDING_URL=${MODELING_EVAL_BINDING_URL:-}
    volumes:
      - modeling-data:/data
      - jiuwenbox-sock:/run/jiuwenbox:ro
    networks:
      - consumer-net
    depends_on:
      modeling-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  modeling-nl2sql:
    profiles: ["eval"]
    image: ${MODELING_IMAGE}
    container_name: mw-modeling-nl2sql
    restart: unless-stopped
    command: ["node", "dist/nl2sql/server.js"]
    expose:
      - "5600"
    environment:
      - NL2SQL_HOST=0.0.0.0
      - NL2SQL_PORT=5600
      - NL2SQL_TOKEN=${NL2SQL_TOKEN:-}
      - EVAL_DB_URL=${EVAL_DB_URL:-}
      - MODELING_LLM_BASE_URL=${MODELING_LLM_BASE_URL:-}
      - MODELING_LLM_MODEL=${MODELING_LLM_MODEL:-}
      - MODELING_LLM_API_KEY=${MODELING_LLM_API_KEY:-}
      - MODELING_LLM_MAX_TOKENS=${MODELING_LLM_MAX_TOKENS:-128000}
      - MODELING_LLM_CONTEXT_WINDOW=${MODELING_LLM_CONTEXT_WINDOW:-1000000}
    networks:
      - consumer-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5600/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

  modeling-agent:
    image: ${MODELING_AGENT_IMAGE}
    container_name: mw-modeling-agent
    restart: unless-stopped
    environment:
      - MODELING_AGENT_DATA_DIR=/data
      - MODELING_CORE_BASE_URL=http://modeling:5100
      - MODELING_LLM_BASE_URL=${MODELING_LLM_BASE_URL:-}
      - MODELING_LLM_MODEL=${MODELING_LLM_MODEL:-}
      - MODELING_LLM_API_KEY=${MODELING_LLM_API_KEY:-}
      - MODELING_LLM_MAX_TOKENS=${MODELING_AGENT_LLM_MAX_TOKENS:-32768}
      # 思维链与正文共用 max_tokens。模型默认就推理时（如 glm 系列）配置侧看不出来，
      # 阶段预算会被推理占满、正文一个 token 都吐不出来；显式设为 enabled 才会追加余量。
      - MODELING_LLM_THINKING_MODE=${MODELING_LLM_THINKING_MODE:-}
      - MODELING_REASONING_HEADROOM_TOKENS=${MODELING_REASONING_HEADROOM_TOKENS:-}
      - MODELING_LEADER_OUTPUT_TOKENS=${MODELING_LEADER_OUTPUT_TOKENS:-}
      - MODELING_AGENT_MAX_ITERATIONS=${MODELING_AGENT_MAX_ITERATIONS:-200}
      # 上下文治理。默认值与 deploy/docker-compose.modeling.yml 保持一致，两条部署
      # 路径的行为必须对齐：条数是安全网，窗口 token 才是主控，预设链不开则超窗
      # 消息直接丢弃且找不回。窗口 token 报大了会涨到模型接不下而硬失败，只能往
      # 小取，大窗口模型由部署按实际容量调高。
      - MODELING_CONTEXT_WINDOW_MESSAGES=${MODELING_CONTEXT_WINDOW_MESSAGES:-400}
      - MODELING_CONTEXT_MAX_MESSAGES=${MODELING_CONTEXT_MAX_MESSAGES:-500}
      - MODELING_CONTEXT_WINDOW_ROUNDS=${MODELING_CONTEXT_WINDOW_ROUNDS:-80}
      - MODELING_CONTEXT_PROCESSOR_PRESET=${MODELING_CONTEXT_PROCESSOR_PRESET:-1}
      - MODELING_CONTEXT_WINDOW_TOKENS=${MODELING_CONTEXT_WINDOW_TOKENS:-128000}
      - MODELING_CONTEXT_PROTECTED_TOOLS=${MODELING_CONTEXT_PROTECTED_TOOLS:-ask,request_confirmation,task_tool}
      - MODELING_SERVICE_TOKEN=${MODELING_SERVICE_TOKEN:-}
    volumes:
      - modeling-agent-data:/data
    networks:
      - consumer-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5110/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  consumer-net:
    external: true
    name: ${CONSUMER_NETWORK:?CONSUMER_NETWORK is required}

volumes:
  modeling-data:
  modeling-agent-data:
  jiuwenbox-sock:
    external: true
    name: ${JIUWENBOX_SOCKET_VOLUME:?JIUWENBOX_SOCKET_VOLUME is required}
