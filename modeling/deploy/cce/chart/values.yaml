global:
  releaseVersion: ""
  operationId: ""
  clusterFlavor: standard
  targetArch: amd64
  imageDelivery:
    pullSecretNames: []
  resolvedImages:
    ontoModeling: ""
    knowledgeHub: ""
    evaluation: ""
    jiuwenbox: ""
  auth:
    issuer: ""
    audience: ""
  access:
    mode: port
    elb:
      id: ""
      class: ""
    protocol: HTTP
    listenerPort: 80
    tlsSecretName: ""
    ingressClassName: ""
    routes: []
    listeners:
      - {id: onto, protocol: HTTP, listenerPort: 5100, tlsSecretName: "", host: "", path: /, pathType: Prefix, endpointId: onto-modeling}
      - {id: evaluation, protocol: HTTP, listenerPort: 5180, tlsSecretName: "", host: "", path: /evaluation/, pathType: Prefix, endpointId: evaluation}
externalAuth:
  apiVersion: auth-v1
  serviceName: ""
  namespace: ""
  servicePort: 5056
externalConsumer:
  serviceName: ""
  namespace: ""
  servicePort: 5055
modeling:
  config:
    ontoJiuwenBaseUrl: ""
    ontoJiuwenModel: ""
    ontoAnthropicBaseUrl: ""
    evalPublicUrl: ""
  workloads:
    onto:
      replicas: 1
      nodeSelector: {}
      persistence:
        existingClaim: ""
      resources: {}
    jiuwenbox:
      nodeSelector: {}
      runtimeClassName: ""
      resources: {}
    sandboxGateway:
      resources: {requests: {cpu: 100m, memory: 256Mi}}
  secrets:
    authAdminToken:
      name: ""
      key: ""
    anthropicAuthToken:
      name: ""
      key: ""
hub:
  replicas: 1
  persistence: {existingClaim: ""}
  resources: {}
  secrets:
    internal: {name: "", modelingTokenKey: modeling-token, evaluationTokenKey: evaluation-token}
    consumerToken: {name: "", key: ""}
evaluation:
  replicas: 1
  persistence: {existingClaim: ""}
  resources: {}
  feedback: {enabled: false, notifyRuns: false}
  trustedOrigins: []
  judge: {baseUrl: "", model: "", configRevision: ""}
  secrets:
    encryptionKey: {name: "", key: encryption-key}
    notificationToken: {name: "", key: service-token}
    consumerToken: {name: "", key: ""}
    flywheelToken: {name: "", key: ""}
    judgeApiKey: {name: "", key: ""}
    sqlConfig: {name: "", key: ""}
