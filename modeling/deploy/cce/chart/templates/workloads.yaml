apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "modeling.name" . }}-onto
spec:
  replicas: {{ .Values.modeling.workloads.onto.replicas }}
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: onto}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: onto}
    spec:
      {{- if .Values.global.imageDelivery.pullSecretNames }}
      imagePullSecrets: {{ include "modeling.pullSecrets" . | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{- toYaml (merge (dict "kubernetes.io/arch" .Values.global.targetArch) .Values.modeling.workloads.onto.nodeSelector) | nindent 8 }}
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-auth
          image: {{ .Values.global.resolvedImages.ontoModeling | quote }}
          imagePullPolicy: IfNotPresent
          command: [python, -m, app.auth_startup]
          env:
            - {name: ONTO_WEB_AUTH_URL, value: {{ include "modeling.authUrl" . | quote }}}
            - {name: ONTO_WEB_AUTH_ISSUER, value: {{ .Values.global.auth.issuer | quote }}}
            - {name: ONTO_WEB_AUTH_AUDIENCE, value: {{ .Values.global.auth.audience | quote }}}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
      containers:
        - name: onto
          image: {{ .Values.global.resolvedImages.ontoModeling | quote }}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8100}]
          env:
            - {name: ONTO_WEB_HOST, value: "0.0.0.0"}
            - {name: ONTO_WEB_PORT, value: "8100"}
            - {name: ONTO_WEB_MODELING_CORE_RETIRED, value: "true"}
            - {name: ONTO_WEB_AUTH_URL, value: {{ include "modeling.authUrl" . | quote }}}
            - {name: ONTO_WEB_AUTH_ISSUER, value: {{ .Values.global.auth.issuer | quote }}}
            - {name: ONTO_WEB_AUTH_AUDIENCE, value: {{ .Values.global.auth.audience | quote }}}
            {{- if .Values.modeling.secrets.authAdminToken.name }}
            - name: ONTO_WEB_AUTH_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.modeling.secrets.authAdminToken.name | quote }}
                  key: {{ .Values.modeling.secrets.authAdminToken.key | quote }}
            {{- end }}
            - {name: ONTO_HUB_URL, value: "http://{{ include "modeling.name" . }}-hub:8200"}
            - name: ONTO_HUB_SERVICE_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.hub.secrets.internal.name | quote }}, key: {{ .Values.hub.secrets.internal.modelingTokenKey | quote }}}
            - name: ONTO_EVALUATION_SERVICE_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ default (printf "%s-notify" .Release.Name) .Values.evaluation.secrets.notificationToken.name | quote }}, key: {{ default "service-token" .Values.evaluation.secrets.notificationToken.key | quote }}}
            - {name: ONTO_WEB_EVAL_PUBLIC_URL, value: {{ .Values.modeling.config.evalPublicUrl | quote }}}
            - {name: ONTO_WEB_EVAL_URL, value: "http://{{ include "modeling.name" . }}-evaluation:5180"}
            - {name: ONTO_WEB_SANDBOX_GATEWAY_URL, value: "http://{{ include "modeling.name" . }}-sandbox-gateway:8110"}
            - {name: ONTO_WEB_JIUWEN_BASE_URL, value: {{ .Values.modeling.config.ontoJiuwenBaseUrl | quote }}}
            - {name: ONTO_WEB_JIUWEN_MODEL, value: {{ .Values.modeling.config.ontoJiuwenModel | quote }}}
            - {name: ANTHROPIC_BASE_URL, value: {{ .Values.modeling.config.ontoAnthropicBaseUrl | quote }}}
            {{- if .Values.modeling.secrets.anthropicAuthToken.name }}
            - name: ANTHROPIC_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.modeling.secrets.anthropicAuthToken.name | quote }}
                  key: {{ .Values.modeling.secrets.anthropicAuthToken.key | quote }}
            {{- end }}
          volumeMounts: [{name: data, mountPath: /data}]
          startupProbe:
            httpGet: {path: /api/health, port: http}
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 10
          resources: {{ toYaml .Values.modeling.workloads.onto.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: {{ .Values.modeling.workloads.onto.persistence.existingClaim | quote }}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "modeling.name" . }}-sandbox-gateway
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: sandbox-gateway}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: sandbox-gateway}
    spec:
      securityContext:
        fsGroup: 65534
      {{- if .Values.global.imageDelivery.pullSecretNames }}
      imagePullSecrets: {{ include "modeling.pullSecrets" . | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{- toYaml (dict "kubernetes.io/arch" .Values.global.targetArch) | nindent 8 }}
      containers:
        - name: sandbox-gateway
          image: {{ .Values.global.resolvedImages.ontoModeling | quote }}
          imagePullPolicy: IfNotPresent
          command: [python, -m, app.sandbox_gateway]
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - {name: ONTO_WEB_SANDBOX_GATEWAY_PORT, value: "8110"}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
          ports: [{name: http, containerPort: 8110}]
          volumeMounts:
            - {name: jiuwenbox-socket, mountPath: /run/jiuwenbox}
            - {name: tmp, mountPath: /tmp}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
          resources: {{ toYaml .Values.modeling.workloads.sandboxGateway.resources | nindent 12 }}
        - name: jiuwenbox
          image: {{ .Values.global.resolvedImages.jiuwenbox | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - {name: JIUWENBOX_LISTEN, value: "unix:///run/jiuwenbox/jiuwenbox.sock"}
            - {name: JIUWENBOX_UDS_MODE, value: "0666"}
            - {name: JIUWENBOX_POLICY_PATH, value: /app/jiuwenbox-policy.yaml}
          volumeMounts:
            - {name: jiuwenbox-socket, mountPath: /run/jiuwenbox}
            - {name: policy, mountPath: /app/jiuwenbox-policy.yaml, subPath: jiuwenbox-policy.yaml, readOnly: true}
            - {name: cgroup, mountPath: /sys/fs/cgroup}
          readinessProbe:
            exec:
              command: [python3, -c, "import socket; s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM); s.connect('/run/jiuwenbox/jiuwenbox.sock'); s.close()"]
            periodSeconds: 10
          resources: {{ toYaml .Values.modeling.workloads.jiuwenbox.resources | nindent 12 }}
      volumes:
        - name: jiuwenbox-socket
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: policy
          configMap: {name: {{ include "modeling.name" . }}-jiuwenbox-policy}
        - name: cgroup
          hostPath: {path: /sys/fs/cgroup, type: Directory}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "modeling.name" . }}-hub
spec:
  replicas: {{ .Values.hub.replicas }}
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: hub}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: hub}
    spec:
      {{- if .Values.global.imageDelivery.pullSecretNames }}
      imagePullSecrets: {{ include "modeling.pullSecrets" . | nindent 8 }}
      {{- end }}
      nodeSelector: {{ include "modeling.arch" . | nindent 8 }}
      containers:
        - name: hub
          image: {{ .Values.global.resolvedImages.knowledgeHub | quote }}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8200}]
          env:
            - {name: HUB_DATA_DIR, value: /data/knowledge-hub}
            - {name: HUB_AUTH_URL, value: {{ include "modeling.authUrl" . | quote }}}
            - {name: HUB_AUTH_ISSUER, value: {{ .Values.global.auth.issuer | quote }}}
            - {name: ONTO_AUTHZ_URL, value: "http://{{ include "modeling.name" . }}-onto:8100/api/internal/hub/authorize"}
            - name: HUB_SERVICE_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.hub.secrets.internal.name | quote }}, key: {{ .Values.hub.secrets.internal.modelingTokenKey | quote }}}
            - name: HUB_EVALUATION_SERVICE_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.hub.secrets.internal.name | quote }}, key: {{ .Values.hub.secrets.internal.evaluationTokenKey | quote }}}
            {{- if .Values.hub.secrets.consumerToken.name }}
            - name: HUB_CONSUMER_SERVICE_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.hub.secrets.consumerToken.name | quote }}, key: {{ .Values.hub.secrets.consumerToken.key | quote }}}
            {{- end }}
          volumeMounts: [{name: data, mountPath: /data}]
          startupProbe: {httpGet: {path: /api/health, port: http}, failureThreshold: 30, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /api/health, port: http}, periodSeconds: 10}
          resources: {{ toYaml .Values.hub.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: {{ .Values.hub.persistence.existingClaim | quote }}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "modeling.name" . }}-evaluation
spec:
  replicas: {{ .Values.evaluation.replicas }}
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: evaluation}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: evaluation}
    spec:
      securityContext: {fsGroup: 10001}
      {{- if .Values.global.imageDelivery.pullSecretNames }}
      imagePullSecrets: {{ include "modeling.pullSecrets" . | nindent 8 }}
      {{- end }}
      nodeSelector: {{ include "modeling.arch" . | nindent 8 }}
      containers:
        - name: evaluation
          image: {{ .Values.global.resolvedImages.evaluation | quote }}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 5180}]
          env:
            - {name: EVAL_DATA_DIR, value: /var/lib/evaluation}
            - {name: EVAL_AUTH_URL, value: {{ include "modeling.authUrl" . | quote }}}
            - {name: EVAL_AUTH_ISSUER, value: {{ .Values.global.auth.issuer | quote }}}
            - {name: EVAL_HUB_URL, value: "http://{{ include "modeling.name" . }}-hub:8200"}
            - {name: EVAL_CONSUMER_API_URL, value: {{ include "modeling.consumerUrl" . | quote }}}
            - {name: EVAL_MODELING_URL, value: "http://{{ include "modeling.name" . }}-onto:8100"}
            - {name: EVAL_FEEDBACK_ENABLED, value: {{ .Values.evaluation.feedback.enabled | quote }}}
            - {name: EVAL_NOTIFY_FEEDBACK_RUNS, value: {{ .Values.evaluation.feedback.notifyRuns | quote }}}
            - name: EVAL_MODELING_SERVICE_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ default (printf "%s-notify" .Release.Name) .Values.evaluation.secrets.notificationToken.name | quote }}, key: {{ default "service-token" .Values.evaluation.secrets.notificationToken.key | quote }}}
            - {name: EVAL_NL2SQL_URL, value: "http://{{ include "modeling.name" . }}-evaluation:5180/evaluation/api/nl2sql"}
            - {name: EVAL_TRUSTED_ORIGINS, value: {{ join "," .Values.evaluation.trustedOrigins | quote }}}
            - {name: EVAL_JUDGE_BASE_URL, value: {{ .Values.evaluation.judge.baseUrl | quote }}}
            - {name: EVAL_JUDGE_MODEL, value: {{ .Values.evaluation.judge.model | quote }}}
            - {name: EVAL_JUDGE_CONFIG_REVISION, value: {{ .Values.evaluation.judge.configRevision | quote }}}
            - name: EVAL_HUB_SERVICE_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.hub.secrets.internal.name | quote }}, key: {{ .Values.hub.secrets.internal.evaluationTokenKey | quote }}}
            - name: EVAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.evaluation.secrets.encryptionKey.name | quote }}, key: {{ .Values.evaluation.secrets.encryptionKey.key | quote }}}
            {{- if .Values.evaluation.secrets.consumerToken.name }}
            - name: EVAL_CONSUMER_SERVICE_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.evaluation.secrets.consumerToken.name | quote }}, key: {{ .Values.evaluation.secrets.consumerToken.key | quote }}}
            {{- end }}
            {{- if .Values.evaluation.secrets.flywheelToken.name }}
            - name: EVAL_FLYWHEEL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.evaluation.secrets.flywheelToken.name | quote }}, key: {{ .Values.evaluation.secrets.flywheelToken.key | quote }}}
            {{- end }}
            {{- if .Values.evaluation.secrets.judgeApiKey.name }}
            - name: EVAL_JUDGE_API_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.evaluation.secrets.judgeApiKey.name | quote }}, key: {{ .Values.evaluation.secrets.judgeApiKey.key | quote }}}
            {{- end }}
            {{- if .Values.evaluation.secrets.sqlConfig.name }}
            - name: EVAL_SQL_CONFIG
              valueFrom:
                secretKeyRef: {name: {{ .Values.evaluation.secrets.sqlConfig.name | quote }}, key: {{ .Values.evaluation.secrets.sqlConfig.key | quote }}}
            {{- end }}
          volumeMounts: [{name: data, mountPath: /var/lib/evaluation}]
          startupProbe: {httpGet: {path: /evaluation/api/health, port: http}, failureThreshold: 30, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /evaluation/api/health, port: http}, periodSeconds: 10}
          resources: {{ toYaml .Values.evaluation.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: {{ .Values.evaluation.persistence.existingClaim | quote }}}
