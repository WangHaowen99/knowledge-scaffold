global:
  clusterFlavor: standard
  targetArch: amd64
  imageDelivery:
    pullSecretNames: [modeling-registry]
  auth:
    issuer: https://auth.example.com
    audience: modeling-demo
  integration:
    serviceTokenSecret:
      name: modeling-integration
      key: service-token
  access:
    elb:
      id: example-elb-id
    protocol: HTTPS
    listenerPort: 443
    tlsSecretName: modeling-tls
    ingressClassName: cce
    routes:
      - {id: core, host: modeling.example.com, path: /, pathType: Prefix, endpointId: modeling-core}
      - {id: onto, host: onto.example.com, path: /, pathType: Prefix, endpointId: onto-modeling}
externalAuth:
  serviceName: consumer-auth
  namespace: consumer-demo
  servicePort: 5056
externalConsumer:
  serviceName: consumer-api
  namespace: consumer-demo
  servicePort: 5055
modeling:
  config:
    llmBaseUrl: https://llm.example.com
    llmModel: demo-model
    taskLlmBaseUrl: ""
    taskLlmModel: ""
    mcpPublicBaseUrl: https://modeling.example.com
    ontoJiuwenBaseUrl: ""
    ontoJiuwenModel: ""
    ontoAnthropicBaseUrl: ""
  workloads:
    core:
      nodeSelector: {}
      persistence: {existingClaim: modeling-core-data}
      resources: {requests: {cpu: 500m, memory: 1Gi}}
    agent:
      nodeSelector: {}
      persistence: {existingClaim: modeling-agent-data}
      resources: {requests: {cpu: 500m, memory: 1Gi}}
    onto:
      nodeSelector: {}
      persistence: {existingClaim: modeling-onto-data}
      resources: {requests: {cpu: 500m, memory: 2Gi}}
    jiuwenbox:
      nodeSelector: {}
      runtimeClassName: ""
      resources: {requests: {cpu: 500m, memory: 1Gi}}
  secrets:
    llmApiKey: {name: "", key: ""}
    evalDbUrl: {name: "", key: ""}
    cleanupToken: {name: "", key: ""}
    anthropicAuthToken: {name: "", key: ""}
  nl2sql: {enabled: false, resources: {}}
