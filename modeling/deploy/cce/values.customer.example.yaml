global:
  clusterFlavor: standard
  targetArch: amd64
  imageDelivery:
    pullSecretNames: [default-secret]
  auth:
    # 独立 Auth 新装示例；issuer/audience 须与 Auth、Consumer values 完全一致。
    issuer: http://auth-auth:5056
    audience: knowledge-scaffold
  access:
    mode: port
    elb:
      id: example-elb-id # 部署时改为实际使用的 ELB ID。
      class: performance
    protocol: HTTP
    listenerPort: 80
    listeners:
      - {id: onto, protocol: HTTP, listenerPort: 5100, tlsSecretName: "", host: "", path: /, pathType: Prefix, endpointId: onto-modeling}
      - {id: evaluation, protocol: HTTP, listenerPort: 5180, tlsSecretName: "", host: "", path: /evaluation/, pathType: Prefix, endpointId: evaluation}
externalAuth:
  apiVersion: auth-v1
  serviceName: auth-auth # 独立 Auth releaseName 为 auth 时；旧内置 Auth 迁移后沿用原 Service 名称。
  namespace: onto-consumer
  servicePort: 5056
externalConsumer:
  serviceName: consumer-backend
  namespace: onto-consumer
  servicePort: 5055
modeling:
  config: {}
  workloads:
    onto:
      persistence: {existingClaim: modeling-onto-data}
      resources: {requests: {cpu: 500m, memory: 2Gi}}
    jiuwenbox:
      resources: {requests: {cpu: 500m, memory: 1Gi}}
    sandboxGateway:
      resources: {requests: {cpu: 100m, memory: 256Mi}}
    connectorGateway:
      resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 1536Mi}}
  secrets:
    authAdminToken: {name: modeling-auth-client, key: admin-token} # 需在 Modeling namespace 预建，与 Auth 管理令牌同值。
hub:
  persistence: {existingClaim: modeling-hub-data}
  resources: {requests: {cpu: 250m, memory: 512Mi}}
  secrets:
    internal: {name: modeling-hub-internal, modelingTokenKey: modeling-token, evaluationTokenKey: evaluation-token}
    # 联合部署启用 Consumer Hub 时，自动填入 modeling-hub-consumer 和 Consumer 源 Secret 引用。
    consumerToken: {name: "", key: ""}
evaluation:
  persistence: {existingClaim: modeling-evaluation-data}
  resources: {requests: {cpu: 250m, memory: 512Mi}}
  feedback: {enabled: false, notifyRuns: false}
  secrets:
    encryptionKey: {name: modeling-evaluation-internal, key: encryption-key}
    # Evaluation sends completion notices to Onto Modeling with this shared token.
    # Pre-create this Secret if the installer can read Secrets but cannot create them.
    notificationToken: {name: modeling-notify, key: service-token}
    # 联合部署配置 Consumer 评测令牌时，自动填入 modeling-evaluation-consumer 和源 Secret 引用。
    consumerToken: {name: "", key: ""}
    # 联合部署开启反馈接收时，自动填入 modeling-flywheel-consumer 和源 Secret 引用。
    flywheelToken: {name: "", key: ""}
