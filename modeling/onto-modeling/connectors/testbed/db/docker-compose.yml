# 数据库提供方（db-mysql、db-postgres）测试床：合成的订单库。只绑 127.0.0.1；密码全部来自环境变量，见 README.md。
name: onto-testbed-db

x-passwords: &passwords
  TESTBED_DB_RO_PASSWORD: ${TESTBED_DB_RO_PASSWORD:?先设置 TESTBED_DB_RO_PASSWORD}
  TESTBED_DB_RW_PASSWORD: ${TESTBED_DB_RW_PASSWORD:?先设置 TESTBED_DB_RW_PASSWORD}

services:
  mysql:
    image: mysql:8.0
    # 测试床数据很小，压低内存占用（默认配置约 400 MB，和别的容器挤在一起时容易被 OOM 杀掉）
    command: ["--innodb-buffer-pool-size=16M", "--performance-schema=OFF", "--max-connections=30",
              "--key-buffer-size=1M", "--innodb-log-buffer-size=1M", "--tmp-table-size=4M"]
    environment:
      <<: *passwords
      MYSQL_ROOT_PASSWORD: ${TESTBED_DB_ROOT_PASSWORD:?先设置 TESTBED_DB_ROOT_PASSWORD}
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./mysql/users.sh:/docker-entrypoint-initdb.d/20-users.sh:ro
    ports:
      - "127.0.0.1:${TESTBED_MYSQL_PORT:-33306}:3306"
    networks: [biz]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 3s
      retries: 60

  postgres:
    image: postgres:16
    environment:
      <<: *passwords
      POSTGRES_PASSWORD: ${TESTBED_DB_ROOT_PASSWORD:?先设置 TESTBED_DB_ROOT_PASSWORD}
      POSTGRES_DB: shopdb
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./postgres/users.sh:/docker-entrypoint-initdb.d/20-users.sh:ro
    ports:
      - "127.0.0.1:${TESTBED_PG_PORT:-55432}:5432"
    networks: [biz]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d shopdb"]
      interval: 3s
      retries: 60

networks:
  biz:
    name: ${TESTBED_DB_NETWORK:-onto-testbed-biz}
