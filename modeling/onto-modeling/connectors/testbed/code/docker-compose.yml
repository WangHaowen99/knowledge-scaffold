# 代码仓库连接器的测试床：git 智能 HTTP（https，自签证书），三个合成项目各一个只读裸仓库。
# 令牌用随机值，不要写进仓库：GIT_TESTBED_TOKEN=$(openssl rand -hex 16) docker compose up -d
services:
  git:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        RUN apt-get update && apt-get install -y --no-install-recommends git openssl \
            && rm -rf /var/lib/apt/lists/*
        COPY . /testbed
        WORKDIR /testbed
    command:
      - sh
      - -c
      - >-
        test -f /certs/git.crt || openssl req -x509 -newkey rsa:2048 -nodes -days 365
        -subj /CN=git.testbed.invalid -addext subjectAltName=DNS:git.testbed.invalid
        -keyout /certs/git.key -out /certs/git.crt && chmod 644 /certs/git.crt;
        exec python server.py --root /srv/git --host 0.0.0.0 --port 8443
        --tls-cert /certs/git.crt --tls-key /certs/git.key
    environment:
      GIT_TESTBED_TOKEN: ${GIT_TESTBED_TOKEN:?要先设置 GIT_TESTBED_TOKEN}
    volumes:
      - certs:/certs
    networks:
      biz:
        aliases: [git.testbed.invalid]

volumes:
  certs:
    name: onto-testbed-git-certs

networks:
  biz:
    name: onto-testbed-biz
