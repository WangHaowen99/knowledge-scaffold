# 基础建模能力（core 包，详设 5.3；方案 D7）。
# 工作区工具箱迁成的官方包，命令名不变（方案第 6 章第 7 项）。0.2.0 起拆出可选包（D7 后半）：
# 场景模拟 trace、知识沉淀 knowledge、代码生成与求解 codegen、图示 diagram、反馈演进 evo、
# 联网调研 websearch、迁移复用 migrate，源目录在 assets/packs/<名>/。知识条目的存放与加载、
# 增量更新（按需节点）、共享契约库留在 core（第 14 章第 15、16 项）。守卫与 hooks 基线不在包里，
# 由内核注入（backend/app/kernel_guards）。镜像启动时把本目录导入包仓库，版本号加内容摘要后缀
# （如 0.1.0+3f9a1c2d）：内容变了就是新版本，包仓库里的版本目录永不改写。
# 新增命令、子代理、脚本时同步下面的清单（静态检查核对「声明的都存在、存在的都声明」）。
name: core
version: 0.3.0
kind: capability
category: capability
label: 基础建模能力
description: 资料分析、建模、指标、校验、发布、增量更新、影响分析、业务知识的存放与加载、共享契约库。
changelog: 建模不分段；去掉全局一致性节点。
publisher:
  kind: official
  label: 平台
required: true
kernel_api: ">=1.0 <2.0"
