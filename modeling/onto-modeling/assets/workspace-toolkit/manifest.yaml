  rules: [workspace-rules.md]
  readme: workspace-readme.md
  # 主流程定义（详设 6.1、6.8；方案 D12）
  flow: flow.yaml
  hooks: {}
  nodes: []
  entries: []
  pages: []
  artifacts: [artifacts/knowledge.yaml]
  views: [views/knowledge.yaml]
  reports: []
  gates: []
  config: []
  metrics: []
checksums: checksums.sha256
