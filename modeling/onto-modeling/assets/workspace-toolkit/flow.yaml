# 主流程定义（详设 6.1、6.8、第 9 章；方案 D12）：阶段、完成判定、命令前置、下一步建议的唯一来源。
#
# 读它的地方（原来散在 5 处，各写一份）：
# - 后端项目进度（项目列表上的 x/N，原 workspace.STAGES）；
# - state_helper.py 的 detect-stage / check-prereq / next-step（原 STAGE_ORDER、COMMAND_PREREQS）；
# - 会话开始的阶段提示（session_start_hook 与宿主注入都经 detect-stage 取阶段）；
# - /ontology 命令里各阶段的「下一步建议」（经 state_helper.py next-step）；
# - GET /api/v1/projects/{id}/flow（前端进度条、建模步骤与建议条改读它，原 LeftPane / ChatPane）。
# 探针怎么算在 scripts/flow_state.py（只用标准库），后端与 state_helper 共用同一份实现。
# 装配时组装成装配目录里的 flow.yaml（JSON 写法，也是合法 YAML）。
#
# 主线（详设 6.8）：资料分析 → 提取对象 → 提取操作（规则与指标随操作一起抽）→ 校验 → 发布；指标、流程图是可选的，
# 增量更新在上传了新资料时出现。建模蓝图（research/blueprint.json）只记统一叫法与待定问题。
#
# 节点什么时候要做只看 need（节点模型重构 2a）：required 上导航栏、计入进度；optional 挂在它前面最近的必需节点下面，
# 可以跳过；{when: <内核条件>} 条件成立时才出现。主命令是 actions 里第一个动作（开始节点、自主构建都用它）。
# 节点名就是主命令名（节点模型重构 2b）：导航栏、全部命令、建议条、对话气泡、排队条、执行记录都叫这一个名字；
# 其余动作是变体，名字单独拿出来也要看得懂（「追加资料分析」，不写「追加」）。
#
# 节点状态由后端按执行记录、变更集、产物指纹算（详设 6.6；方案 D13）。节点上与之相关的声明：
# - produces：本节点的输出（组装时检查两节点不能声明同一路径）；writes：运行期间还会改、但不归它产出的路径；
#   两者合起来是节点运行期间的写入范围——守卫只放行这些路径，编辑器里这些条目只读（方案 C10、D11）；
# - stale_on：这些类别的产物在主线上变了，已确认的节点退回「过期」（research、object、operation、rule、
#   metric、script、mock、testcase、diagram、solver、knowledge；object_set、operation_set 只看条目增删改名）。
#   重新提取类的节点只盯来源（资料分析）和上游条目的增减：对象、操作的内容改了（校验修复、手工编辑）
#   是一致性问题，由校验（它盯着对象、操作的内容）过期去查，不让提取过期（ADR-0102）。下游节点盯着 object 时
#   也算盯着 object_set（增减时内容指纹一定变），交给核对节点的判定（flow_state.handed_down）按这个算；
# - blocks：没确认就挡住的节点（关卡挂在发布前面）；
# - refresh_scope: changed_entries：过期后的刷新只查确认之后改动的条目（见校验节点上的说明）。
flow_api: 1
title: 主流程

# 命名探针：节点的完成判定与旧版线性阶段都由它们组合（`!名字` 表示取反）
probes:
  research_report: {files: [research], glob: "*.md", recursive: true}
  research_accepted: {research: accepted}
  # 资料分析算完成：有报告且验收通过；对象已经提取时验收没过只留提醒、不再挡（issue #362）
  research_done: {research: done, objects: object}
  flowchart: {files: [ontology/diagrams], glob: "*.drawio"}
  object: {files: [ontology/object], glob: "*.md", recursive: true}
  # ontology/logic 是 operation 的旧目录（ADR-0004）
  operation: {files: [ontology/operation, ontology/logic], glob: "*.md", recursive: true}
  rule_metric: {files: [ontology/rule, ontology/metric], glob: "*.md", recursive: true}
  # 「质量检查完成」统一口径：有校验报告（规则或语义检查，示例数据与流程图的检查报告不算），
  # 且 reports/ 下没有未处理的 `[ ]` 条目。原来后端与前端看 reports/ 有没有文件，
  # state_helper 看 validate_last_run，三处各算各的。
  validation_report:
    files: [reports]
    glob: ["*-rule.md", "*-semantic.md"]
    exclude: ["*-mock-rule.md", "*-diagrams-*.md"]
  reports_pending: {pending: [reports], glob: "*.md"}
  mock: {files: [ontology/data-mock]}
  testcase: {files: [ontology/testcase]}
  scripts: {files: [ontology/scripts]}
  solver: {files: [ontology/solver]}
  rule: {files: [ontology/rule], glob: "*.md", recursive: true}
  metric: {files: [ontology/metric], glob: "*.md", recursive: true}
  # 发布过：工作区里有 release/* 标签（发布流程打的，PB-03）
  released: {tags: "release/*"}

# 旧节点编号 → 现在的节点：没升级的包里写的锚点、钩子宿主、命令归属照样认。建模（core.model）拆成提取对象、提取操作，
# 挂在建模后面的锚点算到提取操作；规则与指标成了指标旁支；全局一致性 11-05 删了，挂在它上面的锚点算到校验
aliases:
  core.model: core.operation
  core.rule_metric: core.metric
  core.consistency: core.validate

nodes:
  - id: core.research
    title: 资料分析
    kind: agent
    need: required
    done: [research_done]
    produces: ["research/*"]
    actions:
      # 追加、核验都要已有资料分析报告
      - {label: 资料分析, command: "/ontology-research 仅基于本地文档 "}
      - {label: 追加资料分析, command: "/ontology-research 追加", when: [research_report]}
      # 核验动作（verify）：节点已有产出、还没完成时排第一（报告没核验通过时先核验），其余时候不推
      - {label: 核验资料分析报告, verify: true, when: [research_report], command: "运行 python3 .claude/scripts/research_checker.py 核验资料分析报告，逐条列出错误项与来源位置"}
  # 提取对象、提取操作（ADR-0012：规则、指标随操作提取一起抽，也会补对象的关联）。写入即查由每轮合入时的检查
  # 完成（ADR-0046；F3 起只提示不拦），不单独跑命令
  - id: core.object
    title: 提取对象
    kind: agent
    need: required
    after: core.research
    done: [object]
    stale_on: [research]
    produces: ["ontology/object/*"]
    actions:
      - {label: 提取对象, command: /ontology-extract-object}
  - id: core.operation
    title: 提取操作
    kind: agent
    need: required
    after: core.object
    done: [operation]
    # 重新提取操作只盯资料分析和对象清单（增删改名）；对象内容改了交给校验查（ADR-0102）
    stale_on: [research, object_set]
    produces: ["ontology/operation/*", "ontology/rule/*"]
    writes: ["ontology/logic/*", "ontology/metric/*", "ontology/object/*"]
    actions:
      - {label: 提取操作, command: /ontology-extract-operation}
  # 对象和操作都有了以后上传新资料才出现（内核条件 materials_added）；上传之后开始的一次增量更新正常做完、发布过、
  # 或选了「这一轮不处理」就隐藏，再上传又出现。自主构建不做（条件节点）
  - id: core.update
    title: 增量更新
    kind: agent
    need: {when: materials_added}
    after: core.operation
    done: []
    writes: ["ontology/*", "reports/*"]
    actions:
      - {label: 增量更新, command: "/ontology-update "}
  - id: core.metric
    title: 提取规则与指标
    kind: agent
    need: optional
    after: core.operation
    done: [metric]
    # 可选补抽：对象、操作有增减才可能要补；资料变了时提取操作会过期，重抽操作连规则、指标一起抽（ADR-0102）
    stale_on: [object_set, operation_set]
    produces: ["ontology/metric/*"]
    writes: ["ontology/rule/*", "ontology/operation/*", "ontology/logic/*", "ontology/object/*"]
    actions:
      - {label: 提取规则与指标, command: /ontology-extract-rule-metric}
  - id: core.validate
    title: 校验
    kind: agent
    need: required
    after: core.operation
    done: [validation_report, "!reports_pending"]
    # 脚本、求解契约也进发布检查（ADR-0103）：改了它们，校验之后的发布就绪检查要重查
    stale_on: [object, operation, rule, metric, script, solver]
    produces: ["reports/*-rule.md", "reports/*-semantic.md"]
    # 修复型节点：校验后的修复可能改到任何条目
    writes: ["ontology/*"]
    # 过期后刷新（建议条、节点卡片、待处理、FL-05）发 `/ontology-validate <条目名…> --since <确认时提交前 12 位>`：
    # 条目名是确认之后新增、修改的 object/operation/rule/metric 文件名（去掉 .md），空格分隔，对应命令 Step 0.5
    # 的只查改动模式。删了条目、改了 ontology/logic/ 或非 .md 文件、只改了 index.md 时整条刷新；第一次校验、
    # 点节点上的「校验」、在对话里要求校验照旧全量
    refresh_scope: changed_entries
    actions:
      - {label: 校验, command: /ontology-validate}
  # 发布（详设 6.8 新增）：主线终点，关卡都挂在它前面；就是发布页那套流程（PB-01～PB-03），不另写一套
  - id: core.publish
    title: 发布
    kind: human
    need: required
    after: [trace.trace, core.validate]
    done: [released]
    stale_on: [object, operation, rule, metric, script]
    actions:
      - {label: 发布, page: publish}

# state_helper 的 8 级线性阶段（detect-stage 的输出）：命令模板按这些字面量分支，名字不能改。
# 从低到高排列；判定时从高往低找第一个 when 全部满足的。
stages:
  - {name: 未开始, when: []}
  - {name: 资料分析待核验, when: [research_report]}
  - {name: 资料分析完成, when: [research_report, research_accepted]}
  - {name: 流程图就绪, when: [flowchart]}
  - {name: 对象已提取, when: [object]}
  - {name: 逻辑已提取, when: [operation]}
  - {name: 校验待审阅, when: [operation, reports_pending]}
  - {name: 完成, when: [operation, validation_report, "!reports_pending"]}

# 命令 → 所属节点与前置阶段（check-prereq：每个前置阶段都要已到达，输出 ok 或 missing:…）
# lock_waits：命令停下来等用户在对话里回复时锁切到的阶段（STEP0_TEMPLATE 第 4 步）。声明了表示命令遵守
# 「等回复切 confirm、收尾先释放锁」的约定：一轮正常结束、这次保存过、没有没提交的改动、锁却不在这些阶段时，
# 平台代为释放锁（助手做完了忘了放）；没声明的命令只在建议条上主推「继续」
commands:
  research: {node: core.research, requires: [], lock_waits: [confirm]}
  extract-object: {node: core.object, requires: [资料分析完成], lock_waits: [confirm]}
  extract-operation: {node: core.operation, requires: [对象已提取], lock_waits: [confirm]}
  extract-rule-metric: {node: core.metric, requires: [], lock_waits: [confirm]}
  validate: {node: core.validate, requires: [逻辑已提取, 对象已提取], lock_waits: [confirm]}
  update: {node: core.update, requires: [逻辑已提取, 对象已提取], lock_waits: [confirm]}
  overview: {requires: [对象已提取]}
  impact: {requires: [对象已提取]}
  query: {requires: [对象已提取]}

# /ontology 各阶段「下一步建议」的条目（state_helper.py next-step 原样输出，命令文档不再各写一份）。
# reply 用统一后的名字：节点的是节点名（主命令名），变体用变体名，和界面按钮一个叫法
next_steps:
  未开始:
    - {reply: 资料分析, command: /ontology-research, text: 先做资料分析}
    - {reply: 绘制流程图, command: /ontology-flowchart, text: 直接创建流程图}
    - {line: "或输入 `/ontology <领域名称>` 一键启动（如 `/ontology 电商`）"}
  资料分析待核验:
    - {reply: 修正, text: 按错误项修改报告后重新核验}
    - {reply: 人工确认, text: 你逐条给出结论，我据此补充报告再核验}
    - {reply: 资料分析, command: /ontology-research, text: 重做本轮资料分析}
    - {after: 验收通过前不建议提取对象：错误的字段或 ID 会被后续映射、规则与追溯继续沿用。}
  资料分析完成:
    - {reply: 绘制流程图, command: /ontology-flowchart, text: 创建业务流程图（流程复杂或多子流程交叉时推荐）}
    - {reply: 提取对象, command: /ontology-extract-object, text: 跳过流程图，直接从资料分析报告提取对象（概念清晰、流程线性时推荐）}
    - {reply: 追加资料分析, command: /ontology-research, text: 补充分析方向}
  流程图就绪:
    - {reply: 提取对象, command: /ontology-extract-object, text: 开始提取业务对象}
    - {reply: 校验流程图, command: /ontology-validate-diagrams, text: 先打磨流程图}
  对象已提取:
    - {reply: 提取操作, command: /ontology-extract-operation, text: 提取业务逻辑}
  逻辑已提取:
    - {reply: 校验, command: /ontology-validate, text: 开始校验}
    - {reply: 提取规则与指标, command: /ontology-extract-rule-metric, text: 补抽规则/指标：有资料分析报告的项目在逻辑提取阶段已按分类分流，这里用于从存量 operation 文档与 object 属性规则列补抽遗漏（可选）}
    - {reply: 整体视图, command: /ontology-overview, text: 先看全局关系}
    - {reply: 增量更新, command: /ontology-update, text: 按新的参考内容增量更新已有 ontology}
  校验待审阅:
    - {reply: 校验, command: /ontology-validate, text: 继续处理问题清单}
  完成:
    - {reply: 生成示例数据, command: /ontology-mock, text: 生成测试数据}
    - {reply: 场景模拟, command: /ontology-trace, text: 场景追踪验证}
    - {reply: 交互模拟, command: /ontology-trace 交互, text: 逐个分支由你选方向，AI 辅助构造 testcase 和正常 mock 数据}
    - {reply: 扫描脚本候选, command: /ontology-codegen-scan, text: 看哪些逻辑适合转脚本（推荐先扫一遍）}
    - {reply: 生成脚本, command: /ontology-codegen, text: 生成 Python 代码}
    - {reply: 整体视图, command: /ontology-overview, text: 查看对象/逻辑全局关系}
    - {reply: 校验, command: /ontology-validate, text: 重新校验}
    - {reply: 增量更新, command: /ontology-update, text: 按新的参考内容更新已有 ontology}
    - {reply: 提取对象, command: /ontology-extract-object, text: 增量补充对象}
    - {reply: 提取操作, command: /ontology-extract-operation, text: 增量补充逻辑}
    - {reply: 追加资料分析, command: /ontology-research, text: 追加资料分析}
    - {reply: 版本历史, command: /version, text: 查看历史}
