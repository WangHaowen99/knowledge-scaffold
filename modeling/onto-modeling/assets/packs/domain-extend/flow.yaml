# 领域包扩展（ADR-0099）：锁定底座 → 新增功能 → 底座核对，核对没通过挡发布。
# 底座是导入领域本体包的那次提交里 ontology/ 下的条目（不是哪个文件说了算，助手改不了）。
# confine：scope.json 合入主线、这一轮开着时，底座条目助手不能写也不能删，新增条目不限、网页上人工编辑不限。
# 内核在基线之后发布过就算这一轮结束（ADR-0091），所以发布后底座锁定自动解除：锁定底座的完成条件带上
# session_open，发布后它变回待做，重新锁定前发布被底座核对挡着。
confine: {scope_file: ext/domain-extend/scope.json}
probes:
  domain_extend_bound: {kernel: session_open, session: ext/domain-extend/scope.json}
  domain_extend_added: {files: [ext/domain-extend], glob: added.json}
  domain_extend_checked: {files: [ext/domain-extend], glob: check.md}
  domain_extend_pending: {pending: [ext/domain-extend], glob: check.md}
nodes:
  - id: domain-extend.bind
    title: 锁定底座
    kind: agent
    placement: spine
    section: required
    after: core.operation
    display_after: [core.operation]
    done: [domain_extend_bound]
    produces:
      - ext/domain-extend/scope.json
      - ext/domain-extend/base.json
      - ext/domain-extend/base.md
    entry: {command: /domain-extend-bind}
    actions:
      - {label: 锁定底座, command: /domain-extend-bind}
  # 新增什么要用户说，自主构建不做
  - id: domain-extend.add
    title: 新增功能
    kind: agent
    placement: spine
    section: required
    autobuild: false
    after: domain-extend.bind
    display_after: [domain-extend.bind]
    done: [domain_extend_added]
    produces: [ext/domain-extend/added.json, ext/domain-extend/plan.md]
    writes: ["ontology/object/*", "ontology/operation/*", "ontology/logic/*", "ontology/rule/*", "ontology/metric/*", "ontology/action/*", "ontology/scripts/*", "ontology/testcase/*", "ontology/data-mock/*", "ontology/knowledge/*"]
    entry: {command: /domain-extend-add}
    actions:
      - {label: 新增功能, command: "/domain-extend-add "}
  # 撤回底座改动时要把条目写回导入时的内容，所以带 writes
  - id: domain-extend.check
    title: 底座核对
    kind: agent
    placement: spine
    section: required
    after: domain-extend.bind
    display_after: [domain-extend.add]
    done: [domain_extend_checked, "!domain_extend_pending", domain_extend_bound]
    stale_on: [object, operation, rule, metric, script, solver]
    blocks: [core.publish]
    produces: [ext/domain-extend/check.md, ext/domain-extend/check.json]
    writes: ["ontology/*"]
    entry: {command: /domain-extend-check}
    actions:
      - {label: 底座核对, command: /domain-extend-check}
commands:
  domain-extend-bind: {node: domain-extend.bind, requires: [对象已提取], lock_waits: [confirm]}
  domain-extend-add: {node: domain-extend.add, requires: [对象已提取], lock_waits: [confirm]}
  domain-extend-check: {node: domain-extend.check, requires: [对象已提取], lock_waits: [confirm]}
