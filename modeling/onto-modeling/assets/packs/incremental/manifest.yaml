# 增量构建（ADR-0085、ADR-0091）：已经建了一部分又上传新资料时触发三步：圈定范围 → 范围内修改 → 传播核对，
# 核对没做完挡发布。没触发时节点不出现。范围外的条目由内核按 flow.yaml 的 confine 挡写。
name: incremental
version: 0.2.0
kind: capability
category: capability
label: 增量构建
description: 已经建了一部分又上传新资料时自动触发：先圈定要改的条目和传播链，范围外只读，改完核对传播。没传新资料时不出现。
publisher: {kind: official, label: 平台}
default_on: false
batch: second
kernel_api: ">=1.0 <2.0"
engines: [claude, jiuwen]
depends: {core: ">=0.5"}  # 0.5.0 起内核认 activation、lock_on_activation
changelog: 已经建了一部分又上传新资料才触发，没触发时节点不出现；这一轮随发布结束，改动没核对干净不能结束本轮。
contributes:
  commands: [incremental-scope, incremental-apply, incremental-check]
  scripts: [incremental_chain.py, incremental_scope.py, incremental_check.py]
  prompts:
    - id: incremental-close-round
      match: ["结束本轮"]
      text: >-
        用户要结束这一轮增量构建。运行 /incremental-scope 结束本轮，把范围改成已结束；结束后范围外的条目恢复可写。
  flow: flow.yaml
  nodes: [incremental.scope, incremental.apply, incremental.check]
checksums: checksums.sha256
