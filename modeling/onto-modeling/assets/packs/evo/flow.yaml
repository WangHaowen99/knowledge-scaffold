# 反馈演进按需出现（详设 6.8：evo.evolution 按需）
nodes:
  - id: evo.evolution
    title: 反馈演进
    kind: agent
    placement: on_demand
    section: on_demand
    progress: false
    after: core.model
    display_after: [core.update]
    done: []
    # 反馈演进只改会打包的目录（consumer 看得到）和用例、对账素材（原守卫里的特判，方案 D11 改成声明）
    writes: ["ontology/object/*", "ontology/operation/*", "ontology/logic/*", "ontology/rule/*", "ontology/metric/*", "ontology/scripts/*", "ontology/testcase/*", "ontology/data-mock/*"]
    entry: {command: /ontology-evolution}
    actions:
      - {label: 按外部反馈演进, command: "/ontology-evolution "}
commands:
  evolution: {node: evo.evolution, requires: [对象已提取], lock_waits: [confirm]}
