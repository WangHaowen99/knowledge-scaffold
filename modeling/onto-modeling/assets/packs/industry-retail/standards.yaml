# 研究步骤应主动查找的规范类型（均为示例性的企业内部规范名称，不对应任何真实标准或法规）
standards_api: 1
standards:
  - {title: 门店陈列与补货作业规范（示例）, purpose: 补货规则, note: 企业内部作业规范，通常规定陈列量标准、补货触发条件和取整方式}
  - {title: 门店分级管理办法（示例）, purpose: 门店等级, note: 规定门店分级的维度、阈值和复核周期，陈列量标准与配额常按等级区分}
  - {title: 区域配额与补货审批权限规定（示例）, purpose: 审批门禁, note: 规定配额的分配周期、超量阈值和各级审批岗位}
  - {title: 效期商品管理规定（示例）, purpose: 临期处理, note: 规定临期的判定比例、出清方式以及临期期间是否继续补货}
  - {title: 库存盘点与差异处理规范（示例）, purpose: 库存校正, note: 规定盘点频率、负库存和盘点差异的处理流程}
  - {title: 促销备货指引（示例）, purpose: 促销补货, note: 规定促销补货系数、提前备货天数和促销结束后的回落方式}
