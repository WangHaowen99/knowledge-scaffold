# 场景模拟包往主流程上挂的（详设 6.8）：场景模拟 trace.trace 串在校验之后，「校验」不再改显示名（11-05 起，原来叫「全量回归」、
# 校验显示为「校验与走查」）。F8 起不分段，建模里不再有按段的「场景」一步（与插件化之前一致：场景在校验之后做）。
# 完成判定用 core 的探针（testcase）。
nodes:
  - id: trace.trace
    title: 场景模拟
    kind: agent
    # 串在校验之后；随 core 拆出、本来就在主线上，不当成新插进来的可补做节点（ADR-0066）
    need: required
    after: core.validate
    done: [testcase]
    stale_on: [object, operation]
    produces: ["ontology/testcase/*", "ext/trace/*", "ontology/data-mock/*"]
    # 主命令和节点同名（场景模拟）；变体名单独拿出来也看得懂
    actions:
      - {label: 场景模拟, command: /ontology-trace 全部}
      - {label: 交互模拟, command: /ontology-trace 交互}
      - {label: 生成示例数据, command: /ontology-mock}
# 场景模拟页直接发 trace-batch、trace-single、trace-interactive（不经 /ontology-trace 路由）：都算场景模拟这一步。
# 它们不取自己名字的命令锁（锁记在 trace 上），不写 lock_waits
commands:
  mock: {node: trace.trace, requires: [对象已提取], lock_waits: [confirm]}
  trace: {node: trace.trace, requires: [逻辑已提取], lock_waits: [confirm]}
  trace-batch: {node: trace.trace, requires: [逻辑已提取]}
  trace-single: {node: trace.trace, requires: [逻辑已提取]}
  trace-interactive: {node: trace.trace, requires: [逻辑已提取]}
