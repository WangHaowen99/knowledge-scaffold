publisher: {kind: official, label: 平台}
kernel_api: ">=1.0 <2.0"
engines: [claude, jiuwen]
depends: {}
converter:
  entry: converter.py
  types: [".xlsx", ".xlsm"]
  license: openpyxl（MIT）
changelog: 表头保留全部工作表、全部列（原先只转前 50 个工作表、前 50 列）；宽表少转几行数据。
checksums: checksums.sha256
