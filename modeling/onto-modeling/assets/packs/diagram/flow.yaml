# 图示包的节点（详设 6.8：diagram.flowchart 可选，挂在资料分析之后）
nodes:
  - id: diagram.flowchart
    title: 绘制流程图
    kind: agent
    need: optional
    after: core.research
    done: [flowchart]
    stale_on: [research]
    produces: ["ontology/diagrams/*", "ontology/diagrams-summary/*", "ontology/excel/*", "ontology/mermaid/*"]
    # 全量刷新、校验要已有流程图（core 的探针 flowchart）
    actions:
      - {label: 绘制流程图, command: /ontology-flowchart}
      - {label: 全量刷新流程图, command: /ontology-flowchart 全量刷新, when: [flowchart]}
      - {label: 校验流程图, command: /ontology-validate-diagrams, when: [flowchart]}
commands:
  flowchart: {node: diagram.flowchart, requires: [], lock_waits: [confirm]}
  validate-diagrams: {node: diagram.flowchart, requires: []}
