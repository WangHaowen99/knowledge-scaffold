# 本地从源码构建并拉起全栈（onto-modeling + auth-server），用于交付前验证。
# 生产部署用 deploy/ 下的离线交付包流程。
services:
  auth-server:
    build: ../../auth-server
    container_name: onto-modeling-auth-server-dev
    expose:
      - "5056"
    environment:
      # 首次启动必须提供初始管理员密码（本地验证可在 .env 里设置）
      - AUTH_BOOTSTRAP_ADMIN_PASSWORD=${AUTH_BOOTSTRAP_ADMIN_PASSWORD:-}
      # 管理 API 令牌：与 onto-modeling 的 ONTO_WEB_AUTH_ADMIN_TOKEN 同一个值（.env 里设），运维中心的用户管理靠它
      - AUTH_SERVER_ADMIN_TOKEN=${ONTO_WEB_AUTH_ADMIN_TOKEN:-}
    volumes:
      - onto-modeling-auth-data-dev:/data

  onto-modeling:
    build: .
    # 显式镜像名：脚本验证网关复用同一镜像
    image: onto-modeling-dev:latest
    container_name: onto-modeling-dev
    # 后端不当 1 号进程：孤儿进程有人回收、信号正常转发。执行锁按引擎实例认持有者
    # （state_helper），不依赖后端是不是 1 号进程
    init: true
    ports:
      - "${ONTO_WEB_PORT:-5100}:8100"
    env_file:
      - path: ./.env
        required: false
    environment:
      - ONTO_WEB_AUTH_URL=http://auth-server:5056
      # .env 的 ONTO_WEB_PORT 只控制上面 ports 的宿主发布端口，容器内固定 8100
      - ONTO_WEB_PORT=8100
      # 代码生成脚本的运行验证经网关进 jiuwenbox 沙箱；本容器不挂 jiuwenbox socket
      - ONTO_WEB_SANDBOX_GATEWAY_URL=http://sandbox-gateway:8110
      # 运维中心（/api/v1/ops）默认经业务端口访问：没有反代的单端口部署不打开就用不了，运维接口仍要
      # 登录令牌与 ops 角色。有反代时在 .env 设 false，由反代把 /api/v1/ops/ 转到容器内 8101（见 deploy/README）
      - ONTO_WEB_OPS_ON_MAIN=${ONTO_WEB_OPS_ON_MAIN:-true}
      # 资料转文本经连接器网关（ADR-0073）；网关只在 connector 内部网络上
      - ONTO_WEB_CONNECTOR_GATEWAY_URL=http://connector-gateway:8120
    volumes:
      - onto-modeling-data-dev:/data
    networks:
      - default
      - connector
    depends_on:
      auth-server:
        condition: service_healthy

  # 脚本验证网关：唯一挂载 jiuwenbox 管理 socket 的容器（整栈部署时 deploy/deploy.sh 生成的
  # docker-compose.stack.yml 加挂），说明见 deploy/docker-compose.release.yml
  sandbox-gateway:
    image: onto-modeling-dev:latest
    pull_policy: never
    container_name: onto-modeling-sandbox-gateway-dev
    command: ["python", "-m", "app.sandbox_gateway"]
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
    expose:
      - "8110"
    environment:
      - ONTO_WEB_SANDBOX_GATEWAY_PORT=8110
      - PYTHONDONTWRITEBYTECODE=1
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8110/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # 连接器网关（ADR-0073）：第一版只做文档转换。单独的镜像（Dockerfile 的 connector-gateway 目标），只接
  # internal 网络（没有出口、不接业务网络），不挂数据卷、不读 .env、不存凭据；每个转换一个子进程，限时限内存
  connector-gateway:
    build:
      context: .
      target: connector-gateway
    image: onto-modeling-connector-gateway-dev:latest
    # 每次 up 都按源码重建（层缓存命中时几秒）：叠加覆盖文件的部署不另管这个镜像也不会用旧的；
    # 不写 container_name，容器名跟着 compose 项目名走，不和别的栈撞名
    pull_policy: build
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    pids_limit: 64
    expose:
      - "8120"
    environment:
      - ONTO_CONNECTOR_GATEWAY_PORT=8120
      # 内核签票据的公钥从这里取（网关自己不存任何能签票据的东西）
      - ONTO_CONNECTOR_ISSUER_KEY_URL=http://onto-modeling:8100/api/v1/connector/issuer-key
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8120/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - connector

networks:
  connector:
    internal: true

volumes:
  onto-modeling-data-dev:
  onto-modeling-auth-data-dev:
