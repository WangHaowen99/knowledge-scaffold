# compose 项目名固定为历史值 onto-web：数据卷全名（onto-web_onto-web-data 等）
# 由项目名前缀决定，改名 onto-modeling 后必须沿用旧项目名才能无缝复用存量数据。
name: onto-web

services:
  auth-server:
    image: ${AUTH_SERVER_IMAGE:-onto-modeling-auth-server:latest}
    container_name: onto-modeling-auth-server
    restart: unless-stopped
    # 只在 compose 网络内可达；issuer/audience 用镜像默认值（http://auth-server:5056 / meta-wise），
    # 与 onto-modeling 容器内 ONTO_WEB_AUTH_URL 一致，改动时两边同步
    expose:
      - "5056"
    environment:
      # 首次启动（auth 数据卷为空）必须在 .env 里设初始管理员密码；已有用户数据后可移除
      - AUTH_BOOTSTRAP_ADMIN_PASSWORD=${AUTH_BOOTSTRAP_ADMIN_PASSWORD:-}
      # 管理 API 令牌：与 onto-modeling 的 ONTO_WEB_AUTH_ADMIN_TOKEN 同一个值（.env 里设），运维中心的用户管理靠它
      - AUTH_SERVER_ADMIN_TOKEN=${ONTO_WEB_AUTH_ADMIN_TOKEN:-}
    volumes:
      - onto-web-auth-data:/data
    mem_limit: 512m

  onto-modeling:
    image: ${ONTO_WEB_IMAGE:-onto-modeling:latest}
    container_name: onto-modeling
    restart: unless-stopped
    # 每个活跃会话一个 CLI 子进程（均值约 400MB）；容器上限按
    # 固定开销 + 会话上限 × 单进程峰值 规划（方案 4.1.1），默认对应 8G 主机
    mem_limit: ${ONTO_WEB_MEM_LIMIT:-6500m}
    stop_grace_period: 30s
    # 后端不当 1 号进程：孤儿进程有人回收、信号正常转发。执行锁按引擎实例认持有者
    # （state_helper），不依赖后端是不是 1 号进程
    init: true
    ports:
      - "${ONTO_WEB_PORT:-5100}:8100"
    env_file:
      - ./.env
    environment:
      # 默认连自带 auth-server；接入既有 consumer 栈 auth 时在 .env 覆盖
      # ONTO_MODELING_AUTH_URL（配合 ONTO_MODELING_EXTERNAL_AUTH_NETWORK，见 README）
      - ONTO_WEB_AUTH_URL=${ONTO_MODELING_AUTH_URL:-http://auth-server:5056}
      # 容器必须监听所有网卡，否则宿主机端口转发无法访问（environment 覆盖 env_file）。
      - ONTO_WEB_HOST=0.0.0.0
      # 容器内固定监听 8100（environment 覆盖 env_file），
      # .env 的 ONTO_WEB_PORT 只控制上面 ports 的宿主发布端口
      - ONTO_WEB_PORT=8100
      # 代码生成脚本的运行验证经网关进 jiuwenbox 沙箱；本容器不挂 jiuwenbox socket
      - ONTO_WEB_SANDBOX_GATEWAY_URL=http://sandbox-gateway:8110
      # 运维中心（/api/v1/ops）默认经业务端口访问：没有反代的单端口部署不打开就用不了，运维接口仍要
      # 登录令牌与 ops 角色。有反代时在 .env 设 false，由反代把 /api/v1/ops/ 转到容器内 8101（见 deploy/README）
      - ONTO_WEB_OPS_ON_MAIN=${ONTO_WEB_OPS_ON_MAIN:-true}
      # 资料转文本经连接器网关（ADR-0073）；网关只在 connector 内部网络上
      - ONTO_WEB_CONNECTOR_GATEWAY_URL=http://connector-gateway:8120
    volumes:
      - onto-web-data:/data
    networks:
      - default
      - connector
    depends_on:
      auth-server:
        condition: service_healthy

  # 脚本验证网关：唯一挂载 jiuwenbox 管理 socket 的容器（deploy.sh 生成的 docker-compose.jiuwenbox.yml
  # 加挂），按写死的策略在沙箱里运行脚本。与 onto-modeling 同一镜像，不读 .env、不挂数据卷、
  # 不发布端口，以非 root、只读根文件系统、无 capability 运行
  sandbox-gateway:
    image: ${ONTO_WEB_IMAGE:-onto-modeling:latest}
    container_name: onto-modeling-sandbox-gateway
    restart: unless-stopped
    command: ["python", "-m", "app.sandbox_gateway"]
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
    expose:
      - "8110"
    environment:
      - ONTO_WEB_SANDBOX_GATEWAY_PORT=8110
      - PYTHONDONTWRITEBYTECODE=1
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8110/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # 连接器网关（ADR-0073、0084）：文档转换（PDF、Word、Excel 转文本，转换器随本镜像交付）与证据采集。单独的镜像，
  # 不读 .env、不发布端口；非 root、只读根文件系统、无 capability；每个转换、每个采集任务一个子进程，有超时和内存上限。
  # 接 internal 的 connector、rea 网络，另接 biz-egress 连业务数据库和代码仓库（只有它接，出口按数据源登记的白名单放行）。
  # 业务系统凭据加密存在只有它挂的卷 connector-secrets，主密钥经 compose secrets 给（deploy.sh 在文件不存在时生成）
  connector-gateway:
    image: ${CONNECTOR_GATEWAY_IMAGE:-onto-modeling-connector-gateway:latest}
    container_name: onto-modeling-connector-gateway
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    pids_limit: 64
    expose:
      - "8120"
    environment:
      - ONTO_CONNECTOR_GATEWAY_PORT=8120
      # 内核签票据的公钥从这里取（网关自己不存任何能签票据的东西）
      - ONTO_CONNECTOR_ISSUER_KEY_URL=http://onto-modeling:8100/api/v1/connector/issuer-key
      # 证据采集的提供方 rea-static 经 rea 网络调旁路容器；不配就不列这个提供方
      - ONTO_CONNECTOR_REA_URL=http://rea-sidecar:8130
      # 连接型提供方（数据库、代码仓库）的凭据库与主密钥
      - ONTO_CONNECTOR_SECRETS_DIR=/secrets
      - ONTO_CONNECTOR_MASTER_KEY_FILE=/run/secrets/connector-master-key
    volumes:
      - connector-secrets:/secrets
    secrets:
      - source: connector-master-key
        target: connector-master-key
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8120/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - connector
      - rea
      - biz-egress

  # REA 旁路容器（ADR-0082）：只有它碰目标程序的字节，跑固定版本 REA 白名单里的静态分析命令，不运行目标程序。
  # 只接 rea 内部网络（网络上只有连接器网关，主容器不在上面），没有出口；非 root、只读根文件系统、无 capability，
  # 任务目录在命名卷 /scratch，不读 .env、不发布端口
  rea-sidecar:
    image: ${REA_SIDECAR_IMAGE:-onto-modeling-rea-sidecar:latest}
    container_name: onto-modeling-rea-sidecar
    restart: unless-stopped
    user: node
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - onto-web-rea-scratch:/scratch
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 3g
    pids_limit: 128
    cpus: 2
    expose:
      - "8130"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8130/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - rea

networks:
  connector:
    internal: true
  rea:
    internal: true
  # 有出口：只接连接器网关，主容器和旁路容器都不接
  biz-egress: {}

volumes:
  onto-web-data:
  onto-web-auth-data:
  onto-web-rea-scratch:
  # 凭据密文：和主密钥分开备份，见 README「连接器网关」
  connector-secrets:

secrets:
  connector-master-key:
    file: ${ONTO_CONNECTOR_MASTER_KEY_FILE:-./secrets/connector-master.key}
