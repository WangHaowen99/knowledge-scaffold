# compose 项目名固定为历史值 onto-web：数据卷全名（onto-web_onto-web-data 等）
# 由项目名前缀决定，改名 onto-modeling 后必须沿用旧项目名才能无缝复用存量数据。
name: onto-web

services:
  auth-server:
    image: ${AUTH_SERVER_IMAGE:-onto-modeling-auth-server:latest}
    container_name: onto-modeling-auth-server
    restart: unless-stopped
    # 只在 compose 网络内可达；issuer/audience 用镜像默认值（http://auth-server:5056 / knowledge-scaffold），
    # 与 onto-modeling 容器内 ONTO_WEB_AUTH_URL 一致，改动时两边同步
    expose:
      - "5056"
    environment:
      # 首次启动（auth 数据卷为空）必须在 .env 里设初始管理员密码；已有用户数据后可移除
      - AUTH_BOOTSTRAP_ADMIN_PASSWORD=${AUTH_BOOTSTRAP_ADMIN_PASSWORD:-}
      # 管理 API 令牌：与 onto-modeling 的 ONTO_WEB_AUTH_ADMIN_TOKEN 同一个值（.env 里设），运维中心的用户管理靠它
      - AUTH_SERVER_ADMIN_TOKEN=${ONTO_WEB_AUTH_ADMIN_TOKEN:-}
    volumes:
      - onto-web-auth-data:/data
    mem_limit: 512m

  onto-modeling:
    image: ${ONTO_WEB_IMAGE:-onto-modeling:latest}
    container_name: onto-modeling
    restart: unless-stopped
    # 每个活跃会话一个 CLI 子进程（均值约 400MB）；容器上限按
    # 固定开销 + 会话上限 × 单进程峰值 规划（方案 4.1.1），默认对应 8G 主机
    mem_limit: ${ONTO_WEB_MEM_LIMIT:-6500m}
    stop_grace_period: 30s
    # 后端不当 1 号进程：孤儿进程有人回收、信号正常转发。执行锁按引擎实例认持有者
    # （state_helper），不依赖后端是不是 1 号进程
    init: true
    ports:
      - "${ONTO_WEB_PORT:-5100}:8100"
    env_file:
      - ./.env
    environment:
      - ONTO_WEB_AUTH_URL=${ONTO_MODELING_AUTH_URL:?Set independent Auth URL}
      # 容器必须监听所有网卡，否则宿主机端口转发无法访问（environment 覆盖 env_file）。
      - ONTO_WEB_HOST=0.0.0.0
      # 容器内固定监听 8100（environment 覆盖 env_file），
      # .env 的 ONTO_WEB_PORT 只控制上面 ports 的宿主发布端口
      - ONTO_WEB_PORT=8100
      # 知识包 Hub 独立部署（knowledge-hub/deploy），经共享网络按服务名访问
      - ONTO_HUB_URL=http://knowledge-hub:8200
      - ONTO_HUB_SERVICE_TOKEN=${ONTO_HUB_SERVICE_TOKEN:?Set ONTO_HUB_SERVICE_TOKEN}
      # 独立评测服务：后端按容器名访问（须与评测同在 consumer 网络）；入站凭据校验评测完成通知，留空则拒绝通知
      - ONTO_WEB_EVAL_URL=${ONTO_WEB_EVAL_URL:-http://knowledge-evaluation:5180}
      - ONTO_EVALUATION_SERVICE_TOKEN=${ONTO_EVALUATION_SERVICE_TOKEN:-}
      # 代码生成脚本的运行验证经网关进 jiuwenbox 沙箱；本容器不挂 jiuwenbox socket
      - ONTO_WEB_SANDBOX_GATEWAY_URL=http://sandbox-gateway:8110
      # 运维中心（/api/v1/ops）默认经业务端口访问：没有反代的单端口部署不打开就用不了，运维接口仍要
      # 登录令牌与 ops 角色。有反代时在 .env 设 false，由反代把 /api/v1/ops/ 转到容器内 8101（见 deploy/README）
      - ONTO_WEB_OPS_ON_MAIN=${ONTO_WEB_OPS_ON_MAIN:-true}
      # 资料转文本经连接器网关（ADR-0073）；网关只在 connector 内部网络上
      - ONTO_WEB_CONNECTOR_GATEWAY_URL=http://connector-gateway:8120
    volumes:
      - onto-web-data:/data
    networks:
      - default
      - connector
    depends_on:
      auth-server:
        condition: service_healthy

  # 脚本验证网关：唯一挂载 jiuwenbox 管理 socket 的容器（deploy.sh 生成的 docker-compose.jiuwenbox.yml
  # 加挂），按写死的策略在沙箱里运行脚本。与 onto-modeling 同一镜像，不读 .env、不挂数据卷、
  # 不发布端口，以非 root、只读根文件系统、无 capability 运行
  sandbox-gateway:
    image: ${ONTO_WEB_IMAGE:-onto-modeling:latest}
    container_name: onto-modeling-sandbox-gateway
    restart: unless-stopped
    command: ["python", "-m", "app.sandbox_gateway"]
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
    expose:
      - "8110"
    environment:
      - ONTO_WEB_SANDBOX_GATEWAY_PORT=8110
      - PYTHONDONTWRITEBYTECODE=1
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8110/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # 连接器网关（ADR-0073、ADR-0104）：文档转换（PDF、Word、Excel 转文本）与数据源采集（MySQL、PostgreSQL，
  # 以及管理员在插件中心信任的连接器）。单独的镜像，不读 .env、不发布端口；非 root、只读根文件系统、无 capability；
  # 每个任务一个子进程，有超时和内存上限。connector 内部网络和主服务互通；biz-egress 连业务库，子进程只放行数据源
  # 登记的主机端口。插件卷放信任后交付的连接器，凭据卷放数据源凭据（AES-GCM，主密钥默认在凭据卷里自动生成，
  # 要分开存时挂主密钥文件并配 ONTO_CONNECTOR_MASTER_KEY_FILE）
  connector-gateway:
    image: ${CONNECTOR_GATEWAY_IMAGE:-onto-modeling-connector-gateway:latest}
    container_name: onto-modeling-connector-gateway
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    pids_limit: 64
    expose:
      - "8120"
    environment:
      - ONTO_CONNECTOR_GATEWAY_PORT=8120
      # 内核签票据的公钥从这里取（网关自己不存任何能签票据的东西）
      - ONTO_CONNECTOR_ISSUER_KEY_URL=http://onto-modeling:8100/api/v1/connector/issuer-key
      - ONTO_CONNECTOR_PLUGINS_DIR=/var/lib/connector/plugins
      - ONTO_CONNECTOR_SECRETS_DIR=/var/lib/connector/secrets
    volumes:
      - onto-connector-plugins:/var/lib/connector/plugins
      - onto-connector-secrets:/var/lib/connector/secrets
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8120/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - connector
      - biz-egress

networks:
  connector:
    internal: true
  # 数据源采集的出口（ADR-0104）：只有连接器网关接
  biz-egress:

volumes:
  onto-web-data:
  onto-connector-plugins:
  onto-connector-secrets:
  onto-web-auth-data:
