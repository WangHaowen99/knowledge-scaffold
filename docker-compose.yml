version: '3.3'

# Full-stack deployment: both backend and frontend
# For standalone deployment, use platform/server/docker-compose.yml or
# platform/console/docker-compose.yml.

services:
  backend:
    build:
      context: .
      dockerfile: platform/server/Dockerfile
    image: onto-agent-backend:${TAG:-latest}
    container_name: onto-agent-backend-${TAG:-latest}
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5055}:5055"
    volumes:
      - ./platform/config/legacy-backend-config:/app/config:ro
      - ./.onto-runtime:/app/.onto-runtime
    env_file:
      - ./platform/server/.env
    environment:
      - FLASK_APP=run.py
      - PYTHONUNBUFFERED=1
      - PROJECT_ROOT=/app/.onto-runtime
    networks:
      - onto-agent-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5055/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./platform/console
      dockerfile: Dockerfile
    image: onto-agent-frontend:${TAG:-latest}
    container_name: onto-agent-frontend-${TAG:-latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8888}:80"
    volumes:
      - ./platform/console/logs/nginx:/var/log/nginx
    depends_on:
      - backend
    environment:
      - NGINX_BACKEND_UPSTREAM=${NGINX_BACKEND_UPSTREAM:-http://backend:5055}
      - NGINX_TYPEDB_UPSTREAM=${NGINX_TYPEDB_UPSTREAM:-http://backend:9991}
    networks:
      - onto-agent-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  onto-agent-network:
    driver: bridge
